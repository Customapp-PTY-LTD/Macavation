                    </div>

                            </div>
                        </div>
                    </div>

                    <button class="btn btn-warning me-2" onclick="clearAllData()" id="clearBtn">
                        <i class="fas fa-trash me-2"></i>Clear Existing Data
                    </button>
                    <button class="btn btn-secondary" onclick="clearLog()">

                    </button>
                </div>

                <div class="progress mb-3" style="height: 25px;">

                <div class="progress-log" id="logContainer">

            container.scrollTop = container.scrollHeight;

            document.getElementById('logContainer').innerHTML = '<div class="log-info">Log cleared.</div>';
        }

        function updateProgress(current, total) {
            const pct = Math.round((current / total) * 100);
            const bar = document.getElementById('progressBar');
            bar.style.width = pct + '%';
            bar.textContent = pct + '%';
        }

            { set_name: 'stock_test_data', data_key: 'warehouse_locations', entity_type: 'location', purpose: 'Warehouse location reference', data_json: { locations: ['Cold Room 1', 'Cold Room 2', 'Cold Room 3', 'Cold Room Hold', 'Tank Farm', 'Dispatch Area', 'Receiving Bay'] }},

            // Financial test data
            { set_name: 'financial_test_data', data_key: 'pricing_tiers', entity_type: 'pricing', purpose: 'Kernel pricing tier reference', data_json: { premium_a: { min_crackout: 32, price_per_kg: 165 }, premium_b: { min_crackout: 30, price_per_kg: 155 }, standard_a: { min_crackout: 28, price_per_kg: 145 }, standard_b: { min_crackout: 25, price_per_kg: 130 }}},
            { set_name: 'financial_test_data', data_key: 'deduction_rules', entity_type: 'deduction', purpose: 'Payment deduction rules', data_json: { moisture_threshold: 2.5, deduction_per_half_percent: 1, unsound_deduction_rate: 1, foreign_material_threshold: 0.5 }},
            { set_name: 'financial_test_data', data_key: 'approval_limits', entity_type: 'approval', purpose: 'Payment approval tier limits', data_json: { tier_1_max: 10000, tier_2_max: 50000, tier_3: 'unlimited' }}
        ];

        // ==================== SEEDING FUNCTIONS ====================
        async function clearAllData() {
            if (!confirm('This will delete ALL existing test scenarios, data sets, and records. Continue?')) return;

            log('Clearing existing data...', 'warning');
            document.getElementById('clearBtn').disabled = true;

            try {
                await supabaseClient.from('e2e_test_data_records').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                log('Cleared e2e_test_data_records', 'success');

                await supabaseClient.from('e2e_test_data_sets').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                log('Cleared e2e_test_data_sets', 'success');

                await supabaseClient.from('test_scenarios').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                log('Cleared test_scenarios', 'success');

                log('All data cleared successfully!', 'success');
            } catch (error) {
                log('Error clearing data: ' + error.message, 'error');
                errorCount++;
            }

            document.getElementById('clearBtn').disabled = false;
            updateCounts();
        }

        async function seedAllData() {
            log('Starting data seeding...', 'info');
            document.getElementById('seedBtn').disabled = true;

            scenarioCount = 0;
            dataSetCount = 0;
            recordCount = 0;
            errorCount = 0;

            const totalItems = testScenarios.length + testDataSets.length + testDataRecords.length;
            let completed = 0;

            // Seed Test Scenarios
            log(`Seeding ${testScenarios.length} test scenarios...`, 'info');
            for (const scenario of testScenarios) {
                try {
                    const { error } = await supabaseClient.from('test_scenarios').upsert({
                        scenario_code: scenario.scenario_code,
                        scenario_name: scenario.scenario_name,
                        description: scenario.description,
                        module_name: scenario.module_name,
                        feature_name: scenario.feature_name,
                        test_type: scenario.test_type,
                        severity_level: scenario.severity_level,
                        preconditions: scenario.preconditions,
                        test_steps: scenario.test_steps,
                        expected_result: scenario.expected_result,
                        test_data: scenario.test_data,
                        is_automated: scenario.is_automated,
                        automation_script_path: scenario.automation_script_path,
                        is_active: true
                    }, { onConflict: 'scenario_code' });

                    if (error) throw error;
                    scenarioCount++;
                    log(`  [OK] ${scenario.scenario_code}: ${scenario.scenario_name}`, 'success');
                } catch (error) {
                    log(`  [ERROR] ${scenario.scenario_code}: ${error.message}`, 'error');
                    errorCount++;
                }
                completed++;
                updateProgress(completed, totalItems);
                updateCounts();
            }

            // Seed Test Data Sets
            log(`Seeding ${testDataSets.length} test data sets...`, 'info');
            const setIdMap = {};
            for (const set of testDataSets) {
                try {
                    const { data, error } = await supabaseClient.from('e2e_test_data_sets').upsert({
                        set_name: set.set_name,
                        module: set.module,
                        description: set.description
                    }, { onConflict: 'set_name' }).select();

                    if (error) throw error;
                    if (data && data[0]) {
                        setIdMap[set.set_name] = data[0].id;
                    }
                    dataSetCount++;
                    log(`  [OK] ${set.set_name}`, 'success');
                } catch (error) {
                    log(`  [ERROR] ${set.set_name}: ${error.message}`, 'error');
                    errorCount++;
                }
                completed++;
                updateProgress(completed, totalItems);
                updateCounts();
            }

            // Get set IDs if not returned from upsert
            if (Object.keys(setIdMap).length === 0) {
                const { data: sets } = await supabaseClient.from('e2e_test_data_sets').select('id, set_name');
                if (sets) {
                    sets.forEach(s => setIdMap[s.set_name] = s.id);
                }
            }

            // Seed Test Data Records
            log(`Seeding ${testDataRecords.length} test data records...`, 'info');
            for (const record of testDataRecords) {
                try {
                    const setId = setIdMap[record.set_name];
                    if (!setId) {
                        throw new Error(`Set not found: ${record.set_name}`);
                    }

                    const { error } = await supabaseClient.from('e2e_test_data_records').upsert({
                        set_id: setId,
                        data_key: record.data_key,
                        entity_type: record.entity_type,
                        purpose: record.purpose,
                        data_json: record.data_json
                    }, { onConflict: 'set_id,data_key' });

                    if (error) throw error;
                    recordCount++;
                    log(`  [OK] ${record.data_key}`, 'success');
                } catch (error) {
                    log(`  [ERROR] ${record.data_key}: ${error.message}`, 'error');
                    errorCount++;
                }
                completed++;
                updateProgress(completed, totalItems);
                updateCounts();
            }

            log('', 'info');
            log('========================================', 'info');
            log(`Seeding complete!`, 'success');
            log(`  Scenarios: ${scenarioCount}`, 'success');
            log(`  Data Sets: ${dataSetCount}`, 'success');
            log(`  Records: ${recordCount}`, 'success');
            log(`  Errors: ${errorCount}`, errorCount > 0 ? 'error' : 'success');
            log('========================================', 'info');
            log('You can now refresh the QA Generic Viewer to see the data.', 'info');

            document.getElementById('seedBtn').disabled = false;
        }
    </script>
