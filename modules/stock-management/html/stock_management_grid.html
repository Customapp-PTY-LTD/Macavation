<!-- Stock Management Grid Module -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Stock Management</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <button type="button" class="btn btn-primary" id="addStockBtn">
                <i class="fas fa-plus me-1"></i>New Stock Item
            </button>
            <button type="button" class="btn btn-secondary" id="stockTakeBtn">
                <i class="fas fa-clipboard-check me-1"></i>Stock Take
            </button>
            <button type="button" class="btn btn-outline-secondary" id="exportStockBtn" onclick="stockManagementGrid.exportStock()">
                <i class="fas fa-download me-1"></i>Export
            </button>
        </div>
    </div>
    
    <!-- Search and Filters -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="searchStockInput" class="form-label">Search</label>
                    <input type="text" class="form-control" id="searchStockInput" placeholder="Search by stock number, batch, or location...">
                </div>
                <div class="col-md-2">
                    <label for="filterStockStatus" class="form-label">Status</label>
                    <select class="form-select" id="filterStockStatus">
                        <option value="">All Statuses</option>
                        <option value="available">Available</option>
                        <option value="reserved">Reserved</option>
                        <option value="hold">Hold</option>
                        <option value="dispatched">Dispatched</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="filterStockProduct" class="form-label">Product Type</label>
                    <select class="form-select" id="filterStockProduct">
                        <option value="">All Types</option>
                        <option value="kernel">Kernel</option>
                        <option value="oil">Oil</option>
                        <option value="nis">NIS</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="filterStockLocation" class="form-label">Location</label>
                    <select class="form-select" id="filterStockLocation">
                        <option value="">All Locations</option>
                        <option value="Warehouse A">Warehouse A</option>
                        <option value="Warehouse B">Warehouse B</option>
                        <option value="Warehouse C">Warehouse C</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-secondary w-100" id="clearStockFiltersBtn">
                        <i class="fas fa-times me-1"></i>Clear
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover" id="stockTable">
                    <thead>
                        <tr>
                            <th>Stock Number</th>
                            <th>Product Type</th>
                            <th>Style</th>
                            <th>Batch Number</th>
                            <th>Quantity (kg)</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
