<!-- Kernel Production Grid Module -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Kernel Production Workflow</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <button type="button" class="btn btn-primary" id="addBatchBtn">
                <i class="fas fa-plus me-1"></i>New Production Batch
            </button>
            <button type="button" class="btn btn-outline-secondary" id="exportBatchesBtn" onclick="kernelProductionGrid.exportBatches()">
                <i class="fas fa-download me-1"></i>Export
            </button>
        </div>
    </div>
    
    <!-- Search and Filters -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="searchBatchesInput" class="form-label">Search</label>
                    <input type="text" class="form-control" id="searchBatchesInput" placeholder="Search by batch number, grower, or status...">
                </div>
                <div class="col-md-3">
                    <label for="filterBatchStatus" class="form-label">Status</label>
                    <select class="form-select" id="filterBatchStatus">
                        <option value="">All Statuses</option>
                        <option value="receiving">Receiving</option>
                        <option value="cracking">Cracking</option>
                        <option value="drying">Drying</option>
                        <option value="sorting_dry">Sorting Dry</option>
                        <option value="packing">Packing</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="filterBatchStep" class="form-label">Current Step</label>
                    <select class="form-select" id="filterBatchStep">
                        <option value="">All Steps</option>
                        <option value="1-5">Steps 1-5</option>
                        <option value="6-10">Steps 6-10</option>
                        <option value="11-15">Steps 11-15</option>
                        <option value="16-17">Steps 16-17</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-secondary w-100" id="clearBatchFiltersBtn">
                        <i class="fas fa-times me-1"></i>Clear
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="card mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover" id="batchesTable">
                    <thead>
                        <tr>
                            <th>Batch Number</th>
                            <th>Supplier</th>
                            <th>Received Date</th>
                            <th>Wet NIS (kg)</th>
                            <th>Current Step</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="batchesTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
