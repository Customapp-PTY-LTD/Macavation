<!-- Amanda Dashboard Module - Material Journey Tracking -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Amanda Dashboard - Material Journey</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <button type="button" class="btn btn-secondary" id="refreshBtn">
                <i class="fas fa-sync-alt me-1"></i>Refresh
            </button>
        </div>
    </div>

    <!-- Alerts Section -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card border-warning">
                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>Active Alerts</h5>
                </div>
                <div class="card-body" id="alertsSection">
                    <p class="text-muted mb-0">No active alerts</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Material Journey Cards -->
    <div class="row" id="materialJourneyCards">
        <!-- Cards will be loaded here -->
    </div>
</div>
