<!-- Oil Production Grid Module -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Oil Production Workflow</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <button type="button" class="btn btn-primary" id="addOilBatchBtn">
                <i class="fas fa-plus me-1"></i>New Oil Production Batch
            </button>
        </div>
    </div>
    <div class="card mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover" id="oilBatchesTable">
                    <thead>
                        <tr>
                            <th>Batch Number</th>
                            <th>Input Material</th>
                            <th>Input Quantity (kg)</th>
                            <th>Oil Produced (L)</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="oilBatchesTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
