<!-- Dashboard Module -->
<div class="dashboard-container">
    <!-- Page Header -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h2 class="fw-bold mb-0">Dashboard Overview</h2>
                </div>
            </div>
            <p class="text-muted" id="dashboardDate">
                <span id="currentDate"></span>
            </p>
        </div>
    </div>

    <!-- Exceptions Panel (Exception-First Design) -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        Exceptions Requiring Attention
                    </h5>
                </div>
                <div class="card-body" id="exceptionsContainer">
                    <div class="text-center text-muted py-4">
                        <i class="bi bi-hourglass-split fs-3"></i>
                        <p class="mb-0 mt-2">Loading exceptions...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Key Metrics (Context-Aware) -->
    <div class="row mb-4">
        <div class="col-12">
            <h4 class="fw-bold mb-3">Operational Metrics</h4>
        </div>
        <div id="metricsContainer" class="col-12">
            <!-- Metrics will be dynamically loaded -->
        </div>
    </div>

    <!-- Quick Actions (High-Frequency Tasks) -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-lightning-fill me-2"></i>
                        Quick Actions
                    </h5>
                </div>
                <div class="card-body">
                    <div class="row g-3" id="quickActionsContainer">
                        <!-- Quick actions will be dynamically loaded -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Legacy Alerts (for backward compatibility) -->
    <div class="row mb-4" id="alertsContainer" style="display: none;">
        <!-- Alerts will be dynamically loaded -->
    </div>

    <!-- Legacy Stats (for backward compatibility) -->
    <div class="row g-3 mb-4" id="statsContainer" style="display: none;">
        <!-- Stats cards will be dynamically loaded -->
    </div>

    <!-- Quick Access Modules -->
    <div class="row mb-4">
        <div class="col-12">
            <h4 class="fw-bold mb-3">Quick Access</h4>
        </div>
    </div>

    <div class="row g-3 mb-4" id="modulesContainer">
        <!-- Module cards will be dynamically loaded -->
    </div>

    <!-- Recent Activity & Upcoming Tasks -->
    <div class="row">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-clock-history me-2"></i>Recent Activity
                    </h5>
                </div>
                <div class="card-body">
                    <div class="list-group list-group-flush" id="recentActivityList">
                        <div class="text-center text-muted py-4">
                            <i class="bi bi-hourglass-split fs-3"></i>
                            <p class="mb-0 mt-2">Loading recent activity...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-calendar-event me-2"></i>Upcoming Tasks
                    </h5>
                </div>
                <div class="card-body">
                    <ul class="list-unstyled mb-0" id="upcomingTasksList">
                        <li class="text-center text-muted py-4">
                            <i class="bi bi-hourglass-split fs-3"></i>
                            <p class="mb-0 mt-2">Loading tasks...</p>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
