<!-- Quality Assurance Grid Module -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Quality Assurance & Food Safety</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <button type="button" class="btn btn-primary" id="addTestBtn">
                <i class="fas fa-plus me-1"></i>New Quality Test
            </button>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover" id="testsTable">
                    <thead>
                        <tr>
                            <th>Test Number</th>
                            <th>Test Type</th>
                            <th>Product Type</th>
                            <th>Batch Number</th>
                            <th>Test Date</th>
                            <th>Overall Result</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="testsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
