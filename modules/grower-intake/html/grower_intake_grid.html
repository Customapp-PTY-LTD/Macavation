<!-- Grower Intake Grid Module -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Grower Intake Management</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <button type="button" class="btn btn-primary" id="addSampleBtn">
                <i class="fas fa-plus me-1"></i>New Sample Submission
            </button>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover" id="samplesTable">
                    <thead>
                        <tr>
                            <th>Submission Number</th>
                            <th>Grower</th>
                            <th>Delivery Date</th>
                            <th>Wet NIS (kg)</th>
                            <th>Moisture %</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="samplesTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
