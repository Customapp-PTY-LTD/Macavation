<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-label="Macavation supply-chain overview" class="process-map-root">
  <title>Macavation supply-chain overview</title>
  <desc>Kernel stream from grower intake to kernel dispatch; oil stream from supplier intake to oil dispatch; shared CRM, quality, documents, and admin. Click a box to open that help topic.</desc>
  <defs>
    <style>
      .box { fill: #f4f7f5; stroke: #2d4a3e; stroke-width: 2; rx: 8; }
      .stream { fill: #e8f0ec; stroke: #2d4a3e; stroke-width: 1.5; rx: 6; }
      .lbl { font-family: system-ui, Segoe UI, sans-serif; font-size: 13px; fill: #1a2e26; pointer-events: none; }
      .hdr { font-weight: 700; font-size: 14px; }
      .map-arrow { stroke: #4a6b5c; stroke-width: 2; fill: none; }
      .map-hit { cursor: pointer; outline: none; }
      .map-hit:focus-visible .stream { stroke: #0d4a32; stroke-width: 3; }
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a6b5c"/>
    </marker>
  </defs>
  <rect class="box" x="8" y="8" width="904" height="324" pointer-events="none"/>
  <text class="lbl hdr" x="24" y="36" pointer-events="none">Macavation — high-level module map</text>

  <text class="lbl hdr" x="24" y="68" pointer-events="none">Kernel stream</text>
  <path class="map-arrow kernel-flow" d="M148 100 H168" marker-end="url(#m)"/>
  <path class="map-arrow kernel-flow" d="M306 100 H326" marker-end="url(#m)"/>
  <path class="map-arrow kernel-flow" d="M444 100 H464" marker-end="url(#m)"/>
  <a tabindex="0" href="#grower-intake-grid" class="map-hit map-stream-step map-grower-intake">
    <title>Grower intake — open user guide</title>
    <rect class="stream" x="24" y="78" width="120" height="44"/><text class="lbl" x="42" y="104">Grower intake</text>
  </a>
  <a tabindex="0" href="#kernel-production-grid" class="map-hit map-stream-step map-kernel-production">
    <title>Kernel production — open user guide</title>
    <rect class="stream" x="172" y="78" width="130" height="44"/><text class="lbl" x="188" y="104">Kernel production</text>
  </a>
  <a tabindex="0" href="#stock-management-grid" class="map-hit map-stream-step map-stock-kernel">
    <title>Stock (kernel) — open user guide</title>
    <rect class="stream" x="330" y="78" width="110" height="44"/><text class="lbl" x="348" y="104">Stock (kernel)</text>
  </a>
  <a tabindex="0" href="#kernel-dispatch-grid" class="map-hit map-stream-step map-kernel-dispatch">
    <title>Kernel dispatch — open user guide</title>
    <rect class="stream" x="468" y="78" width="130" height="44"/><text class="lbl" x="482" y="104">Kernel dispatch</text>
  </a>

  <text class="lbl hdr" x="24" y="158" pointer-events="none">Oil &amp; protein stream</text>
  <path class="map-arrow oil-flow" d="M158 190 H178" marker-end="url(#m)"/>
  <path class="map-arrow oil-flow" d="M306 190 H326" marker-end="url(#m)"/>
  <path class="map-arrow oil-flow" d="M464 190 H484" marker-end="url(#m)"/>
  <a tabindex="0" href="#supplier-intake-grid" class="map-hit map-stream-step map-supplier-intake">
    <title>Supplier intake — open user guide</title>
    <rect class="stream" x="24" y="168" width="130" height="44"/><text class="lbl" x="38" y="194">Supplier intake</text>
  </a>
  <a tabindex="0" href="#oil-production-grid" class="map-hit map-stream-step map-oil-production">
    <title>Oil production — open user guide</title>
    <rect class="stream" x="182" y="168" width="120" height="44"/><text class="lbl" x="196" y="194">Oil production</text>
  </a>
  <a tabindex="0" href="#stock-management-grid" class="map-hit map-stream-step map-stock-oil">
    <title>Stock (oil/protein) — open user guide</title>
    <rect class="stream" x="330" y="168" width="130" height="44"/><text class="lbl" x="338" y="194">Stock (oil/protein)</text>
  </a>
  <a tabindex="0" href="#oil-dispatch-grid" class="map-hit map-stream-step map-oil-dispatch">
    <title>Oil &amp; protein dispatch — open user guide</title>
    <rect class="stream" x="488" y="168" width="150" height="44"/><text class="lbl" x="500" y="194">Oil &amp; protein dispatch</text>
  </a>

  <text class="lbl hdr" x="24" y="248" pointer-events="none">Shared &amp; admin</text>
  <a tabindex="0" href="#crm-nis-suppliers" class="map-hit map-shared-crm">
    <title>CRM (contacts) — open user guide</title>
    <rect class="stream" x="24" y="258" width="100" height="40"/><text class="lbl" x="44" y="282">CRM</text>
  </a>
  <a tabindex="0" href="#quality-assurance-grid" class="map-hit map-shared-quality">
    <title>Quality — open user guide</title>
    <rect class="stream" x="138" y="258" width="100" height="40"/><text class="lbl" x="148" y="282">Quality</text>
  </a>
  <a tabindex="0" href="#document-management-grid" class="map-hit map-shared-documents">
    <title>Documents — open user guide</title>
    <rect class="stream" x="252" y="258" width="110" height="40"/><text class="lbl" x="262" y="282">Documents</text>
  </a>
  <a tabindex="0" href="#palladium-integration-grid" class="map-hit map-shared-palladium">
    <title>Palladium — open user guide</title>
    <rect class="stream" x="376" y="258" width="120" height="40"/><text class="lbl" x="388" y="282">Palladium</text>
  </a>
  <a tabindex="0" href="#users-grid" class="map-hit map-shared-users">
    <title>Users — open user guide</title>
    <rect class="stream" x="510" y="258" width="90" height="40"/><text class="lbl" x="528" y="282">Users</text>
  </a>
  <a tabindex="0" href="#admin-users-permissions" class="map-hit map-shared-admin">
    <title>Admin — open user guide</title>
    <rect class="stream" x="614" y="258" width="70" height="40"/><text class="lbl" x="632" y="282">Admin</text>
  </a>
  <a tabindex="0" href="#my-day" class="map-hit map-shared-myday">
    <title>My Day — open user guide</title>
    <rect class="stream" x="698" y="258" width="110" height="40"/><text class="lbl" x="708" y="282">My Day</text>
  </a>
</svg>
