<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" role="img" aria-label="Kernel batch lifecycle">
  <title>Kernel batch lifecycle</title>
  <desc>From grower intake through production, quality, stock, and kernel dispatch.</desc>
  <defs>
    <style>
      .box { fill: #f4f7f5; stroke: #2d4a3e; stroke-width: 2; rx: 8; }
      .step { fill: #e8f0ec; stroke: #2d4a3e; stroke-width: 1.5; rx: 6; }
      .lbl { font-family: system-ui, Segoe UI, sans-serif; font-size: 12px; fill: #1a2e26; pointer-events: none; }
      .hdr { font-weight: 700; font-size: 14px; }
      .map-arrow { stroke: #4a6b5c; stroke-width: 2; fill: none; }
      .map-hit { cursor: pointer; outline: none; }
      .map-hit:focus-visible .step { stroke: #0d4a32; stroke-width: 3; }
    </style>
    <marker id="km" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a6b5c"/>
    </marker>
  </defs>
  <rect class="box" x="8" y="8" width="864" height="184" pointer-events="none"/>
  <text class="lbl hdr" x="24" y="36" pointer-events="none">Kernel batch lifecycle</text>
  <path class="map-arrow" d="M148 108 H168" marker-end="url(#km)"/>
  <path class="map-arrow" d="M296 108 H316" marker-end="url(#km)"/>
  <path class="map-arrow" d="M434 108 H454" marker-end="url(#km)"/>
  <path class="map-arrow" d="M572 108 H592" marker-end="url(#km)"/>
  <path class="map-arrow" d="M710 108 H730" marker-end="url(#km)"/>
  <a tabindex="0" href="#grower-intake-grid" class="map-hit">
    <title>Grower intake</title>
    <rect class="step" x="24" y="86" width="120" height="44"/><text class="lbl" x="36" y="112">Grower intake</text>
  </a>
  <a tabindex="0" href="#kernel-production-grid" class="map-hit">
    <title>Kernel production</title>
    <rect class="step" x="172" y="86" width="120" height="44"/><text class="lbl" x="182" y="112">Production</text>
  </a>
  <a tabindex="0" href="#quality-assurance-grid" class="map-hit">
    <title>Quality assurance</title>
    <rect class="step" x="320" y="86" width="110" height="44"/><text class="lbl" x="332" y="112">Quality</text>
  </a>
  <a tabindex="0" href="#stock-management-grid" class="map-hit">
    <title>Stock kernel</title>
    <rect class="step" x="458" y="86" width="110" height="44"/><text class="lbl" x="472" y="112">Stock</text>
  </a>
  <a tabindex="0" href="#kernel-dispatch-grid" class="map-hit">
    <title>Kernel dispatch</title>
    <rect class="step" x="596" y="86" width="110" height="44"/><text class="lbl" x="602" y="112">Dispatch</text>
  </a>
  <a tabindex="0" href="#batch-journey-grid" class="map-hit">
    <title>Batch journey</title>
    <rect class="step" x="734" y="86" width="120" height="44"/><text class="lbl" x="742" y="112">Batch journey</text>
  </a>
  <text class="lbl" x="24" y="168" pointer-events="none">Receiving checklist ’ batch test ’ job card / stages ’ QA release ’ send to dispatch</text>
</svg>
