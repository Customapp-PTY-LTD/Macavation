<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" role="img" aria-label="User and access administration flow">
  <title>User and access flow</title>
  <desc>People, roles, permissions, and features for portal access control.</desc>
  <defs>
    <style>
      .box { fill: #f4f7f5; stroke: #2d4a3e; stroke-width: 2; rx: 8; }
      .step { fill: #e8f0ec; stroke: #2d4a3e; stroke-width: 1.5; rx: 6; }
      .lbl { font-family: system-ui, Segoe UI, sans-serif; font-size: 12px; fill: #1a2e26; pointer-events: none; }
      .hdr { font-weight: 700; font-size: 14px; }
      .map-arrow { stroke: #4a6b5c; stroke-width: 2; fill: none; }
      .map-hit { cursor: pointer; outline: none; }
      .map-hit:focus-visible .step { stroke: #0d4a32; stroke-width: 3; }
    </style>
    <marker id="um" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a6b5c"/>
    </marker>
  </defs>
  <rect class="box" x="8" y="8" width="804" height="184" pointer-events="none"/>
  <text class="lbl hdr" x="24" y="36" pointer-events="none">User &amp; access  setup order</text>
  <path class="map-arrow" d="M168 108 H188" marker-end="url(#um)"/>
  <path class="map-arrow" d="M316 108 H336" marker-end="url(#um)"/>
  <path class="map-arrow" d="M464 108 H484" marker-end="url(#um)"/>
  <path class="map-arrow" d="M612 108 H632" marker-end="url(#um)"/>
  <a tabindex="0" href="#admin-roles-management" class="map-hit">
    <title>Roles</title>
    <rect class="step" x="24" y="86" width="140" height="44"/><text class="lbl" x="58" y="112">Roles</text>
  </a>
  <a tabindex="0" href="#role-permissions-grid" class="map-hit">
    <title>Permissions</title>
    <rect class="step" x="192" y="86" width="120" height="44"/><text class="lbl" x="206" y="112">Permissions</text>
  </a>
  <a tabindex="0" href="#role-features-grid" class="map-hit">
    <title>Features</title>
    <rect class="step" x="340" y="86" width="120" height="44"/><text class="lbl" x="358" y="112">Features</text>
  </a>
  <a tabindex="0" href="#admin-users-permissions" class="map-hit">
    <title>People</title>
    <rect class="step" x="488" y="86" width="120" height="44"/><text class="lbl" x="518" y="112">People</text>
  </a>
  <a tabindex="0" href="#features-grid" class="map-hit">
    <title>Feature catalogue</title>
    <rect class="step" x="636" y="86" width="140" height="44"/><text class="lbl" x="648" y="112">Feature catalogue</text>
  </a>
  <text class="lbl" x="24" y="168" pointer-events="none">For admins: define roles and access first, then assign users. Test with a non-admin login after changes.</text>
</svg>
