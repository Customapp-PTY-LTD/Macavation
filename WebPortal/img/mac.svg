<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mac">
  <defs>
    <linearGradient id="macShell" x1="18%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#4A7C59"/>
      <stop offset="55%" stop-color="#198754"/>
      <stop offset="100%" stop-color="#2D4A3E"/>
    </linearGradient>
    <linearGradient id="macKernel" x1="30%" y1="20%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#FFFEF8"/>
      <stop offset="45%" stop-color="#F5F0E8"/>
      <stop offset="100%" stop-color="#E8DFD0"/>
    </linearGradient>
    <radialGradient id="macCheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A962" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C9A962" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Outer shell -->
  <circle cx="32" cy="32" r="30" fill="url(#macShell)"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#146c43" stroke-width="1.5" opacity="0.35"/>
  <!-- Kernel face -->
  <ellipse cx="32" cy="35.5" rx="17.5" ry="15.5" fill="url(#macKernel)"/>
  <ellipse cx="32" cy="35.5" rx="17.5" ry="15.5" fill="none" stroke="#8d7434" stroke-width="0.75" opacity="0.25"/>
  <!-- Soft cheeks -->
  <circle cx="22" cy="38" r="4" fill="url(#macCheek)"/>
  <circle cx="42" cy="38" r="4" fill="url(#macCheek)"/>
  <!-- Eyes -->
  <circle cx="25.5" cy="33.5" r="2.6" fill="#1F1F1F"/>
  <circle cx="38.5" cy="33.5" r="2.6" fill="#1F1F1F"/>
  <circle cx="26.3" cy="32.7" r="0.85" fill="#FFFEF8"/>
  <circle cx="39.3" cy="32.7" r="0.85" fill="#FFFEF8"/>
  <!-- Gold smile -->
  <path d="M25.5 41.5c2.8 3.2 10.2 3.2 13 0" fill="none" stroke="#C9A962" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Shell highlight -->
  <ellipse cx="20" cy="18" rx="5" ry="3.2" fill="#FFFEF8" opacity="0.22"/>
</svg>
