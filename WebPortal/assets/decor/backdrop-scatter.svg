<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="none">
<!--
  Full-viewport scatter mirroring the sign-in layout (same 13 motifs, positions
  and rotations). Faint background-image on modal / Swal backdrops — an easter
  egg. Paths are inlined (not <use>/<defs>) because SVGs loaded as CSS
  background-images run in secure static mode and won't resolve internal <use>.
  Colours mirror mac-brown (#6d5822) / mac-green (#198754); faintness is set
  by CSS opacity on the pseudo-element.
-->
  <!-- s1 nut -->
  <g transform="translate(80,54) scale(1.10) rotate(-14 60 60)" fill="none" stroke="#6d5822" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 19 C 83 19 101 38 101 62 C 101 86 83 102 60 102 C 37 102 19 86 19 62 C 19 38 37 19 60 19 Z"/>
    <path d="M61 23 C 85 42 85 82 61 99"/>
  </g>
  <!-- s2 oil drop -->
  <g transform="translate(432,36) scale(0.55) rotate(9 60 60)" fill="none" stroke="#198754" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 14 C 68 36 88 55 88 76 A 28 28 0 1 1 32 76 C 32 55 52 36 60 14 Z"/>
    <path d="M46 68 C 42 77 42 89 48 98"/>
  </g>
  <!-- s3 leaf -->
