<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-label="CRM contact types map">
  <title>CRM contact types</title>
  <desc>Five CRM tabs: NIS suppliers, oil processors, ingredient suppliers, oil customers, kernel customers.</desc>
  <defs>
    <style>
      .box { fill: #f4f7f5; stroke: #2d4a3e; stroke-width: 2; rx: 8; }
      .tab { fill: #e8f0ec; stroke: #2d4a3e; stroke-width: 1.5; rx: 6; }
      .lbl { font-family: system-ui, Segoe UI, sans-serif; font-size: 11px; fill: #1a2e26; pointer-events: none; }
      .hdr { font-weight: 700; font-size: 14px; }
      .map-hit { cursor: pointer; outline: none; }
      .map-hit:focus-visible .tab { stroke: #0d4a32; stroke-width: 3; }
    </style>
  </defs>
  <rect class="box" x="8" y="8" width="904" height="204" pointer-events="none"/>
  <text class="lbl hdr" x="24" y="36" pointer-events="none">CRM  contact database tabs</text>
  <text class="lbl" x="24" y="58" pointer-events="none">Each tab is a separate list. Pick the tab that matches who you are maintaining.</text>
  <a tabindex="0" href="#crm-nis-suppliers" class="map-hit">
    <title>NIS suppliers</title>
    <rect class="tab" x="24" y="78" width="160" height="52"/><text class="lbl" x="48" y="108">NIS suppliers</text>
  </a>
  <a tabindex="0" href="#crm-oil-processors" class="map-hit">
    <title>Oil processors</title>
    <rect class="tab" x="196" y="78" width="160" height="52"/><text class="lbl" x="218" y="108">Oil processors</text>
  </a>
  <a tabindex="0" href="#crm-oil-ingredient-suppliers" class="map-hit">
    <title>Oil ingredient suppliers</title>
    <rect class="tab" x="368" y="78" width="160" height="52"/><text class="lbl" x="378" y="108">Ingredient suppliers</text>
  </a>
  <a tabindex="0" href="#crm-oil-protein-customers" class="map-hit">
    <title>Oil and protein customers</title>
    <rect class="tab" x="540" y="78" width="160" height="52"/><text class="lbl" x="552" y="108">Oil customers</text>
  </a>
  <a tabindex="0" href="#crm-kernel-customers" class="map-hit">
    <title>Kernel customers</title>
    <rect class="tab" x="712" y="78" width="160" height="52"/><text class="lbl" x="732" y="108">Kernel customers</text>
  </a>
  <text class="lbl" x="24" y="168" pointer-events="none">Used by: grower intake (NIS) · supplier intake (ingredient) · dispatch (customers) · reporting</text>
  <a tabindex="0" href="#modal-crm-contact" class="map-hit">
    <title>Add contact dialog</title>
    <rect class="tab" x="24" y="178" width="200" height="28"/><text class="lbl" x="52" y="196">Add / edit contact (dialog)</text>
  </a>
</svg>
