<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password — Macavation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/design-tokens.css" rel="stylesheet">
    <style>
        body { background: var(--mac-bg); color: var(--mac-text); font-family: var(--mac-font); min-height: 100vh; display: flex; align-items: center; }
        .reset-card { max-width: 420px; margin: 0 auto; border: 1px solid var(--mac-border-strong); border-radius: var(--mac-radius-lg); }
        .brand { color: var(--mac-green); }
        .btn-primary { background: var(--mac-green); border-color: var(--mac-green); }
        .btn-primary:hover { background: var(--mac-green-hover); border-color: var(--mac-green-hover); }
    </style>
</head>

<body>
    <div class="container">
        <div class="card reset-card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-1"><i class="fas fa-seedling brand me-2"></i>Macavation</h1>
                <p class="text-muted mb-4">Set a new password</p>

                <form id="resetForm">
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">New password</label>
                        <input type="password" class="form-control" id="newPassword" autocomplete="new-password" placeholder="At least 8 characters" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm new password</label>
                        <input type="password" class="form-control" id="confirmPassword" autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="submitBtn">Reset password</button>
                </form>

                <div id="message" class="mt-3" role="alert"></div>
                <div class="mt-3 text-center">
                    <a href="signin.html" class="small">Back to sign in</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/macavation-supabase.js?v=20260707c"></script>
    <script>
        (function () {
            'use strict';
            var cfg = window.MACAVATION_SUPABASE || null;
            var params = new URLSearchParams(window.location.search);
            var token = params.get('token');
            var form = document.getElementById('resetForm');
            var messageEl = document.getElementById('message');
            var submitBtn = document.getElementById('submitBtn');

            function show(type, text) {
                messageEl.className = 'mt-3 alert alert-' + type;
                messageEl.textContent = text;
            }

            if (!cfg || !cfg.url || !cfg.anonKey) {
                show('danger', 'Configuration error. Please try again from the sign-in page.');
                form.style.display = 'none';
                return;
            }
            if (!token) {
                show('danger', 'This reset link is invalid or incomplete. Please request a new one.');
                form.style.display = 'none';
                return;
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                var pw = document.getElementById('newPassword').value;
                var cf = document.getElementById('confirmPassword').value;
                if (pw.length < 8) { show('warning', 'Password must be at least 8 characters.'); return; }
                if (pw !== cf) { show('warning', 'Passwords do not match.'); return; }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Resetting…';
                try {
                    var response = await fetch(cfg.url + '/rest/v1/rpc/confirm_password_reset', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + cfg.anonKey,
                            'apikey': cfg.anonKey
                        },
                        body: JSON.stringify({ p_token: token, p_new_password: pw })
                    });
                    var data = await response.json().catch(function () { return null; });
                    if (data && data.success) {
                        form.style.display = 'none';
                        show('success', (data.message || 'Password reset.') + ' Redirecting to sign in…');
                        setTimeout(function () { window.location.href = 'signin.html'; }, 2500);
                    } else {
                        show('danger', (data && data.message) || 'Could not reset password. The link may have expired.');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Reset password';
                    }
                } catch (err) {
                    show('danger', 'Something went wrong. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset password';
                }
            });
        }());
    </script>
</body>

</html>
