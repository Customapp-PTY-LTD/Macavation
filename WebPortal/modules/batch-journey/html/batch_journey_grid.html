<div class="module-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Batch Journey</h1>
        <div class="btn-toolbar mb-0">
            <a href="help/index.html#batch-journey-grid" class="btn btn-sm btn-outline-secondary me-2 macavation-help-link" title="User guide"><i class="fas fa-circle-question me-1"></i>Help</a>
        </div>
    </div>

    <!-- Filters -->
    <div class="card mb-3">
        <div class="card-body py-2">
            <div class="row align-items-center g-2">
                <div class="col-md-4">
                    <input type="text" class="form-control form-control-sm" id="bjSearchInput"
                        placeholder="Search batch, grower...">
                </div>
                <div class="col-md-3">
                    <select class="form-select form-select-sm" id="bjStatusFilter">
                        <option value="">All Statuses</option>
                        <option value="intake">Intake</option>
                        <option value="receiving">Receiving</option>
                        <option value="production">Production</option>
                        <option value="qa">QA</option>
                        <option value="dispatch">Dispatch</option>
                        <option value="complete">Complete</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select form-select-sm" id="bjSortBy">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="status">By Status</option>
                        <option value="grower">By Grower</option>
                        <option value="weight">By Weight (Heaviest)</option>
                        <option value="moisture">By Moisture Level</option>
                    </select>
                </div>
                <div class="col-md-2 text-end">
                    <span class="text-muted small" id="bjBatchCount"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover table-sm mb-0" id="bjTable">
                <thead>
                    <tr>
                        <th>Batch #</th>
                        <th>Grower</th>
                        <th>Status</th>
                        <th>Received</th>
                        <th class="text-end">Weight (kg)</th>
                        <th class="text-end">Moisture</th>
                        <th class="text-end">Total Yield (kg)</th>
                        <th class="text-end" style="width:1%">Actions</th>
                    </tr>
                </thead>
                <tbody id="bjTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Batch History Modal -->
    <div class="modal fade" data-bs-backdrop="static" data-bs-keyboard="false" id="batchHistoryModal" role="dialog" route-name="batch-history-modal" tabindex="-1" aria-labelledby="batchHistoryModalLabel" aria-hidden="true"></div>
</div>
