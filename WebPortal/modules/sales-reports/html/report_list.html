<!-- Sales & Production Reports — weekly/monthly report list -->
<div class="module-content" id="salesReportsModule">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Sales &amp; Production Reports</h1>
        <div class="btn-toolbar mb-2 mb-md-0 ms-auto gap-2">
            <button type="button" class="btn btn-outline-secondary" id="refreshReportListBtn">
                <i class="fas fa-sync-alt me-1"></i>Refresh
            </button>
            <button type="button" class="btn btn-primary" id="newReportBtn" data-action-perm="reports.report.create">
                <i class="fas fa-plus me-1"></i>New Report
            </button>
        </div>
    </div>

    <!-- Filters -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label for="reportFilterPeriodType" class="form-label">Type</label>
                    <select class="form-select" id="reportFilterPeriodType">
                        <option value="">All Types</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="reportFilterStatus" class="form-label">Status</label>
                    <select class="form-select" id="reportFilterStatus">
                        <option value="">All Statuses</option>
                        <option value="draft">Draft</option>
                        <option value="published">Published</option>
                        <option value="superseded">Superseded</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-secondary w-100" id="clearReportFiltersBtn">
                        <i class="fas fa-times me-1"></i>Clear
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Reports table -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table align-middle table-hover" id="reportListTable">
                    <thead>
                        <tr>
                            <th>Period</th>
                            <th>Type</th>
                            <th>Date range</th>
                            <th>Status</th>
                            <th>Overridden</th>
                            <th>Generated</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="reportListTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav aria-label="Report list pagination" class="mt-3">
        <ul class="pagination justify-content-center" id="reportListPagination"></ul>
    </nav>
</div>

<!-- New Report modal -->
<div class="modal fade" id="newReportModal" tabindex="-1" role="dialog" aria-labelledby="newReportModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="newReportModalLabel">New Report</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="newReportForm">
                    <div class="mb-3">
                        <label class="form-label">Report type</label>
                        <div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="newReportPeriodType" id="newReportPeriodTypeWeekly" value="weekly" checked>
                                <label class="form-check-label" for="newReportPeriodTypeWeekly">Weekly</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="newReportPeriodType" id="newReportPeriodTypeMonthly" value="monthly">
                                <label class="form-check-label" for="newReportPeriodTypeMonthly">Monthly</label>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="newReportPeriod" class="form-label">Period</label>
                        <select class="form-select" id="newReportPeriod" name="newReportPeriod" required>
                            <option value="">Loading periods...</option>
                        </select>
                        <div class="form-text" id="newReportPeriodRange"></div>
                    </div>
                    <div class="alert alert-warning d-none" id="newReportNoTemplateMsg">
                        No active report template exists for this report type yet.
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="createReportBtn">
                    <i class="fas fa-plus me-1"></i>Create Report
                </button>
            </div>
        </div>
    </div>
</div>
