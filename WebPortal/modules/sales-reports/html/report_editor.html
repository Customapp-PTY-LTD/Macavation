<!-- Sales & Production Reports — report editor -->
<div class="module-content" id="reportEditorModule">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <div>
            <button type="button" class="btn btn-link p-0 mb-1" id="reportEditorBackBtn">
                <i class="fas fa-arrow-left me-1"></i>Back to reports
            </button>
            <h1 class="h2 mb-0" id="reportEditorTitle">&nbsp;</h1>
            <div class="text-muted small" id="reportEditorSubtitle"></div>
        </div>
        <div class="btn-toolbar mb-2 mb-md-0 ms-auto gap-2">
            <button type="button" class="btn btn-outline-secondary" id="reportEditorRefreshFiguresBtn" data-action-perm="reports.report.edit">
                <i class="fas fa-sync-alt me-1"></i>Refresh figures
            </button>
            <!-- No data-action-perm: exporting a report you can already read needs no stricter gate
                 than opening this screen, which the route itself governs. -->
            <button type="button" class="btn btn-outline-secondary" id="reportEditorDownloadPdfBtn" disabled>
                <i class="fas fa-file-pdf me-1"></i>Download PDF
            </button>
            <button type="button" class="btn btn-outline-success d-none" id="reportEditorSendWhatsappBtn"
                    data-action-perm="reports.report.generate">
                <i class="fab fa-whatsapp me-1"></i>Send via WhatsApp
            </button>
            <button type="button" class="btn btn-primary d-none" id="reportEditorPublishBtn"
                    data-action-perm="reports.report.publish">
                <i class="fas fa-lock me-1"></i>Publish
            </button>
            <button type="button" class="btn btn-outline-secondary d-none" id="reportEditorReissueBtn"
                    data-action-perm="reports.report.publish">
                <i class="fas fa-rotate-left me-1"></i>Re-issue
            </button>
        </div>
    </div>

    <div class="alert alert-warning d-none" role="alert" id="reportEditorLockedBanner"></div>

    <div id="reportEditorContent" class="d-none">
        <div class="card mb-3">
            <div class="card-body">
                <label for="reportEditorExecSummary" class="form-label fw-semibold">Executive summary</label>
                <textarea class="form-control" id="reportEditorExecSummary" rows="4"></textarea>
            </div>
        </div>

        <div class="accordion" id="reportEditorAccordion"></div>
    </div>

    <div id="reportEditorEmptyState"></div>
    <div id="reportEditorLoadingState" class="text-center py-5">
        <i class="fas fa-spinner fa-spin me-2"></i>Loading report&hellip;
    </div>
</div>

<!-- Send via WhatsApp modal — every recipient label/phone/status/error below is populated by JS
     via .text() or a self-escaping helper; no database value appears in this static markup. -->
<div class="modal fade" id="reportWhatsappSendModal" tabindex="-1" role="dialog"
     aria-labelledby="reportWhatsappSendModalLabel" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="reportWhatsappSendModalLabel">
                    <i class="fab fa-whatsapp me-2"></i>Send via WhatsApp
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="text-muted small mb-3" id="reportWhatsappSendPeriodLabel"></div>

                <div id="reportWhatsappSendLoading" class="text-center py-4 d-none">
                    <i class="fas fa-spinner fa-spin me-2"></i>Loading recipients&hellip;
                </div>

                <div id="reportWhatsappSendGroups" class="d-none">
                    <div class="mb-3">
                        <h6 class="mb-2">From WhatsApp inbox</h6>
                        <div class="text-muted small mb-2 d-none" id="reportWhatsappSendInboxUnavailable">
                            The shared WhatsApp inbox is not available on this database.
                        </div>
                        <div id="reportWhatsappSendInboxList"></div>
                    </div>

                    <div class="mb-3">
                        <h6 class="mb-2">From CRM contacts</h6>
                        <div id="reportWhatsappSendCrmList"></div>
                    </div>

                    <div class="text-muted small mb-3 d-none" id="reportWhatsappSendSkippedNote"></div>

                    <div class="mb-3">
                        <h6 class="mb-2">Added for this send</h6>
                        <div class="text-muted small mb-2">Not saved &mdash; this send only.</div>
                        <div id="reportWhatsappSendManualList" class="mb-2"></div>
                        <div class="row g-2 align-items-start">
                            <div class="col-sm-5">
                                <input type="text" class="form-control form-control-sm"
                                       id="reportWhatsappSendOtherLabel" placeholder="Label (optional)">
                            </div>
                            <div class="col-sm-5">
                                <input type="text" class="form-control form-control-sm"
                                       id="reportWhatsappSendOtherNumber" placeholder="Mobile number">
                            </div>
                            <div class="col-sm-2">
                                <button type="button" class="btn btn-outline-secondary btn-sm w-100"
                                        id="reportWhatsappSendAddNumberBtn">Add</button>
                            </div>
                        </div>
                        <div class="text-danger small mt-1 d-none" id="reportWhatsappSendOtherError"></div>
                    </div>
                </div>

                <div id="reportWhatsappSendResults" class="mt-3 d-none"></div>
            </div>
            <div class="modal-footer justify-content-between">
                <div>
                    <span id="reportWhatsappSendSelectedCount" class="small text-muted">0 recipients selected</span>
                    <span class="small text-warning d-none ms-2" id="reportWhatsappSendCapNote">Maximum of 25 reached.</span>
                </div>
                <div>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-outline-success" id="reportWhatsappSendBtn" disabled>
                        <i class="fab fa-whatsapp me-1"></i>Send
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
