<!-- Sales & Production Reports — report editor -->
<div class="module-content" id="reportEditorModule">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <div>
            <button type="button" class="btn btn-link p-0 mb-1" id="reportEditorBackBtn">
                <i class="fas fa-arrow-left me-1"></i>Back to reports
            </button>
            <h1 class="h2 mb-0" id="reportEditorTitle">&nbsp;</h1>
            <div class="text-muted small" id="reportEditorSubtitle"></div>
        </div>
        <div class="btn-toolbar mb-2 mb-md-0 ms-auto gap-2">
            <button type="button" class="btn btn-outline-secondary" id="reportEditorRefreshFiguresBtn" data-action-perm="reports.report.edit">
                <i class="fas fa-sync-alt me-1"></i>Refresh figures
            </button>
            <!-- No data-action-perm: exporting a report you can already read needs no stricter gate
                 than opening this screen, which the route itself governs. -->
            <button type="button" class="btn btn-outline-secondary" id="reportEditorDownloadPdfBtn" disabled>
                <i class="fas fa-file-pdf me-1"></i>Download PDF
            </button>
            <button type="button" class="btn btn-outline-success d-none" id="reportEditorSendWhatsappBtn"
                    data-action-perm="reports.report.send">
                <i class="fas fa-paper-plane me-1"></i>Send via WhatsApp
            </button>
            <button type="button" class="btn btn-primary d-none" id="reportEditorPublishBtn"
                    data-action-perm="reports.report.publish">
                <i class="fas fa-lock me-1"></i>Publish
            </button>
            <button type="button" class="btn btn-outline-secondary d-none" id="reportEditorReissueBtn"
                    data-action-perm="reports.report.publish">
                <i class="fas fa-rotate-left me-1"></i>Re-issue
            </button>
        </div>
    </div>

    <div class="alert alert-warning d-none" role="alert" id="reportEditorLockedBanner"></div>

    <div id="reportEditorContent" class="d-none">
        <div class="card mb-3">
            <div class="card-body">
                <label for="reportEditorExecSummary" class="form-label fw-semibold">Executive summary</label>
                <textarea class="form-control" id="reportEditorExecSummary" rows="4"></textarea>
            </div>
        </div>

        <div class="accordion" id="reportEditorAccordion"></div>

        <!-- WhatsApp distribution history — who this report has been sent to, and re-sending a
             failed/incomplete delivery. Every row is rendered by report-whatsapp-history.js; no
             database value appears in this static markup. -->
        <div class="card mt-3 d-none" id="reportWhatsappHistoryCard">
            <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <span class="fw-semibold">Distribution</span>
                    <span class="text-muted small ms-1" id="reportWhatsappHistoryCount"></span>
                </div>
                <button type="button" class="btn btn-sm btn-outline-primary d-none" id="reportWhatsappHistoryResendFailedBtn">
                    <i class="fas fa-paper-plane me-1"></i>Re-send all failed
                </button>
            </div>
            <div class="card-body">
                <div class="text-muted small d-none" id="reportWhatsappHistoryMsg"></div>
                <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Recipient</th>
                                <th>Number</th>
                                <th>Status</th>
                                <th>When</th>
                                <th>Sent by</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="reportWhatsappHistoryBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="reportEditorEmptyState"></div>
    <div id="reportEditorLoadingState" class="text-center py-5">
        <i class="fas fa-spinner fa-spin me-2"></i>Loading report&hellip;
    </div>
</div>

<!-- Send via WhatsApp modal — every group list, the add-number sub-form and the results list are
     populated by report-whatsapp-send.js; no database value appears in this static markup. -->
<div class="modal fade" id="reportWhatsappSendModal" tabindex="-1" role="dialog"
     aria-labelledby="reportWhatsappSendModalLabel" aria-hidden="true"
     data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="reportWhatsappSendModalLabel">Send via WhatsApp</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="reportWhatsappSendBody"></div>
                <div id="reportWhatsappSendAddForm"></div>
                <div id="reportWhatsappSendResults" class="mt-3 d-none"></div>
            </div>
            <div class="modal-footer">
                <div class="me-auto small text-muted" id="reportWhatsappSendFooterCount">0 recipients selected</div>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="reportWhatsappSendSubmitBtn" disabled>
                    <i class="fas fa-paper-plane me-1"></i>Send
                </button>
            </div>
        </div>
    </div>
</div>
