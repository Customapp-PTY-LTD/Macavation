<!-- Supplier Intake: Oil & Protein (UI follows UI_DESIGN_INSTRUCTIONS.md) -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Supplier Intake</h1>
        <div class="btn-toolbar mb-2 mb-md-0 ms-auto">
            <button type="button" class="btn btn-primary me-2" id="addNewBatchProductBtn">
                <i class="fas fa-plus me-1"></i>Add new batch of product
            </button>
            <button type="button" class="btn btn-outline-secondary" id="receivingChecklistBtn">
                <i class="fas fa-clipboard-list me-1"></i>Incoming Receiving Checklist
            </button>
        </div>
    </div>

    <!-- Filters -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="searchSupplierIntakeInput" class="form-label">Search</label>
                    <input type="text" class="form-control" id="searchSupplierIntakeInput" placeholder="Search by batch #, supplier, delivery note...">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-secondary w-100" id="clearSupplierIntakeFiltersBtn">
                        <i class="fas fa-times me-1"></i>Clear
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-4 supplier-intake-grid-card">
        <div class="card-header bg-light d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Batches in supplier intake</h5>
            <button type="button" class="btn btn-sm btn-primary" id="refreshSupplierIntakeBtn"><i class="fas fa-sync-alt me-1"></i>Refresh</button>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-sm table-hover" id="supplierIntakeBatchesTable">
                    <thead>
                        <tr>
                            <th>Batch #</th>
                            <th>Product type</th>
                            <th>Date received</th>
                            <th>Delivery note / PO</th>
                            <th>Supplier</th>
                            <th>Quantity (kg)</th>
                            <th>Mfg / Best before</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="supplierIntakeBatchesTableBody">
                        <tr><td colspan="9" class="text-center text-muted py-4"><i class="fas fa-info-circle me-2"></i>Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- New batch of product modal (content loaded by route new-batch-modal) -->
<div class="modal fade" id="newBatchProductModal" tabindex="-1" role="dialog" aria-labelledby="newBatchProductModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" route-name="new-batch-modal"></div>

<!-- Incoming Receiving Checklist (content loaded by route receiving-checklist-modal) -->
<div class="modal fade" id="receivingChecklistModal" tabindex="-1" role="dialog" aria-labelledby="receivingChecklistModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" route-name="receiving-checklist-modal"></div>
