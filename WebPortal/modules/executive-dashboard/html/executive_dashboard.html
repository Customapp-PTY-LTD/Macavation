<!-- Executive Dashboard Module -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Executive Dashboard & Reporting</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <button type="button" class="btn btn-primary" id="generateReportBtn">
                <i class="fas fa-file-pdf me-1"></i>Generate Report
            </button>
        </div>
    </div>

    <!-- KPI Cards -->
    <div class="row mb-4">
        <div class="col-md-3 mb-3">
            <div class="card border-primary">
                <div class="card-body">
                    <h6 class="text-muted">Total Production (kg)</h6>
                    <h3 id="totalProduction">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card border-success">
                <div class="card-body">
                    <h6 class="text-muted">Active Batches</h6>
                    <h3 id="activeBatches">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card border-info">
                <div class="card-body">
                    <h6 class="text-muted">Total Sales (ZAR)</h6>
                    <h3 id="totalSales">R 0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card border-warning">
                <div class="card-body">
                    <h6 class="text-muted">Quality Pass Rate</h6>
                    <h3 id="qualityPassRate">0%</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Charts Section -->
    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Production Trends</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted">Chart will be displayed here</p>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Sales Performance</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted">Chart will be displayed here</p>
                </div>
            </div>
        </div>
    </div>
</div>
