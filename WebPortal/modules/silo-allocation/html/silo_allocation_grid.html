<!-- Silo Allocation — put received bags into silos, open a silo to start cracking, close it to
     log the run. Three cards: Allocate bags (folds away), Silos, Cracking log. All content is rendered by
     silo_allocation_grid.js. -->
<div class="module-content" id="siloAllocationModule">
    <div class="nss-crumb">Kernel pipeline &rsaquo; NIS storage &amp; silos</div>
    <h1 class="h2 mb-2">NIS storage &amp; silos</h1>
    <div role="tablist" aria-label="Sections" class="nss-tabs">
        <button type="button" role="tab" class="nss-tab" id="nssTabAreas" aria-selected="false" data-nss-tab="areas">Storage areas</button>
        <button type="button" role="tab" class="nss-tab" id="nssTabSilos" aria-selected="true" data-nss-tab="silos">Silos</button>
    </div>
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h2 class="h4 mb-0">Silo allocation</h2>
        <div class="d-flex gap-2 align-items-center">
            <!-- Silo calendar: bags allocated and silos cracked each day (js/mac-activity-calendar.js) -->
            <div id="siloActivityCalendarMount"></div>
            <button type="button" class="btn btn-outline-secondary" id="siloRefreshBtn">
                <i class="fas fa-sync-alt me-1"></i>Refresh
            </button>
        </div>
    </div>

    <div id="siloNotice"></div>

    <!-- Allocate bags folds away to one line (remembered on this device) so the silos get the screen. -->
    <div class="card mb-3 silo-alloc-card">
        <button type="button" class="card-header silo-alloc-toggle" id="siloAllocToggle"
                aria-expanded="false" aria-controls="siloAllocBody">
            <i class="fas fa-chevron-right silo-alloc-chevron" aria-hidden="true"></i>
            <span class="h5 mb-0">Allocate bags</span>
            <span class="small text-muted silo-alloc-summary" id="siloAllocCount"></span>
            <span class="silo-alloc-toggle-label" id="siloAllocToggleLabel">Show</span>
        </button>
        <div class="card-body d-none" id="siloAllocBody"></div>
    </div>

    <div class="card mb-3 d-none" id="siloTallyCard">
        <div class="card-header d-flex justify-content-between flex-wrap gap-2 align-items-center">
            <h2 class="h5 mb-0" id="siloTallyTitle">Pre-sizer tally</h2>
            <span class="small text-muted">Running total for the whole batch</span>
        </div>
        <div class="card-body" id="siloTallyBody"></div>
    </div>

    <div class="card mb-3">
        <div class="card-header d-flex justify-content-between flex-wrap gap-2 align-items-center">
            <h2 class="h5 mb-0">Silos</h2>
            <div class="silo-legend small">
                <span><i class="silo-swatch silo-swatch-high"></i>80&ndash;100% full</span>
                <span><i class="silo-swatch silo-swatch-mid"></i>40&ndash;79%</span>
                <span><i class="silo-swatch silo-swatch-low"></i>Under 40%</span>
                <span><i class="silo-swatch silo-swatch-empty"></i>Empty</span>
            </div>
        </div>
        <div class="card-body">
            <!-- "Show a batch": highlights every silo a batch is in (rendered by silo_allocation_grid.js). -->
            <div class="silo-batch-chips" id="siloBatchChips"></div>
            <div id="siloBatchSpread"></div>
            <div class="silo-grid" id="siloGrid"></div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between flex-wrap gap-2 align-items-center">
            <h2 class="h5 mb-0">Cracking log</h2>
            <span class="small text-muted" id="siloTodaySummary"></span>
        </div>
        <!-- Pick a day or a week; totals, the per-day bars and the table follow the pick. -->
        <div class="silo-period-bar">
            <div class="btn-group" role="group" aria-label="Show by">
                <button type="button" class="btn btn-outline-secondary silo-period-mode" data-mode="day">Day</button>
                <button type="button" class="btn btn-outline-secondary silo-period-mode" data-mode="week">Week</button>
            </div>
            <div class="d-flex gap-1 align-items-center">
                <button type="button" class="btn btn-outline-secondary" id="siloPeriodPrev" aria-label="Previous"><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
                <label for="siloPeriodDate" class="visually-hidden">Pick a date</label>
                <input type="date" class="form-control silo-period-date" id="siloPeriodDate">
                <button type="button" class="btn btn-outline-secondary" id="siloPeriodNext" aria-label="Next"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
            </div>
            <button type="button" class="btn btn-outline-secondary" id="siloPeriodToday">Today</button>
            <span class="silo-period-label" id="siloPeriodLabel"></span>
        </div>
        <div class="silo-period-totals" id="siloPeriodTotals"></div>
        <div class="silo-period-days d-none" id="siloPeriodDays"></div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table align-middle mb-0" id="siloRunsTable">
                    <thead>
                        <tr>
                            <th class="silo-col">Date</th>
                            <th class="silo-col">Silo</th>
                            <th class="silo-col">Batch</th>
                            <th class="silo-col">Supplier</th>
                            <th class="silo-col text-end">Volume cracked (kg)</th>
                            <th class="silo-col text-end">Left in silo (kg)</th>
                            <th class="silo-col text-end">Time</th>
                            <th class="silo-col text-end">kg / hour</th>
                            <th class="silo-col"></th>
                        </tr>
                    </thead>
                    <tbody id="siloRunsBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
