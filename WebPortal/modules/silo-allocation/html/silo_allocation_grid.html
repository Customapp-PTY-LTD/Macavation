<!-- Silo Allocation — put received bags into silos, open a silo to start cracking, close it to
     log the run. Three cards: Allocate bags, Silos, Cracking log. All content is rendered by
     silo_allocation_grid.js. -->
<div class="module-content" id="siloAllocationModule">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Silo Allocation</h1>
        <button type="button" class="btn btn-outline-secondary" id="siloRefreshBtn">
            <i class="fas fa-sync-alt me-1"></i>Refresh
        </button>
    </div>

    <div id="siloNotice"></div>

    <div class="card mb-3">
        <div class="card-header d-flex justify-content-between flex-wrap gap-2 align-items-center">
            <h2 class="h5 mb-0">Allocate bags</h2>
            <span class="small text-muted" id="siloAllocCount"></span>
        </div>
        <div class="card-body" id="siloAllocBody"></div>
    </div>

    <div class="card mb-3 d-none" id="siloTallyCard">
        <div class="card-header d-flex justify-content-between flex-wrap gap-2 align-items-center">
            <h2 class="h5 mb-0" id="siloTallyTitle">Pre-sizer tally</h2>
            <span class="small text-muted">Running total for the whole batch</span>
        </div>
        <div class="card-body" id="siloTallyBody"></div>
    </div>

    <div class="card mb-3">
        <div class="card-header d-flex justify-content-between flex-wrap gap-2 align-items-center">
            <h2 class="h5 mb-0">Silos</h2>
            <div class="silo-legend small">
                <span><i class="silo-swatch silo-swatch-high"></i>80&ndash;100% full</span>
                <span><i class="silo-swatch silo-swatch-mid"></i>40&ndash;79%</span>
                <span><i class="silo-swatch silo-swatch-low"></i>Under 40%</span>
                <span><i class="silo-swatch silo-swatch-empty"></i>Empty</span>
            </div>
        </div>
        <div class="card-body">
            <div class="silo-grid" id="siloGrid"></div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between flex-wrap gap-2 align-items-center">
            <h2 class="h5 mb-0">Cracking log</h2>
            <span class="small text-muted" id="siloTodaySummary"></span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table align-middle mb-0" id="siloRunsTable">
                    <thead>
                        <tr>
                            <th class="silo-col">Date</th>
                            <th class="silo-col">Silo</th>
                            <th class="silo-col">Batch</th>
                            <th class="silo-col text-end">Volume cracked (kg)</th>
                            <th class="silo-col text-end">Left in silo (kg)</th>
                            <th class="silo-col text-end">Time</th>
                            <th class="silo-col text-end">kg / hour</th>
                            <th class="silo-col"></th>
                        </tr>
                    </thead>
                    <tbody id="siloRunsBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
