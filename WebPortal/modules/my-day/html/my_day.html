<!-- My Day Dashboard - Role-Based Workflow View -->
<div class="my-day-container">
    <div class="d-flex justify-content-end align-items-center gap-2 px-3 pt-3 pb-0">
        <button type="button" class="btn btn-sm btn-outline-primary" id="my-day-history-btn" aria-expanded="false" aria-controls="my-day-history-card" onclick="workflowViews.toggleTaskHistory()"><i class="fas fa-clock-rotate-left me-1"></i>Task history</button>
        <a target="_blank" rel="noopener noreferrer" href="help/index.html#my-day" class="btn btn-sm btn-outline-secondary macavation-help-link" title="User guide"><i class="fas fa-circle-question me-1"></i>Help</a>
    </div>
    <div id="my-day-container">
        <!-- Content will be dynamically loaded -->
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3 text-muted">Loading your personalized dashboard...</p>
        </div>
    </div>
</div>
