<!-- Role Features Grid Module -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Role Features</h1>
        <div class="btn-toolbar mb-2 mb-md-0 ms-auto">
            <button type="button" class="btn btn-outline-secondary" id="exportFeaturesBtn">
                <i class="fas fa-download me-1"></i>Export
            </button>
            <button type="button" class="btn btn-outline-secondary" id="refreshFeaturesBtn">
                <i class="fas fa-sync-alt me-1"></i>Refresh
            </button>
            <button type="button" class="btn btn-primary" id="addFeatureBtn">
                <i class="fas fa-plus me-1"></i>Add Feature
            </button>
        </div>
    </div>

    <!-- Search and filters -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label for="searchInput" class="form-label">Search</label>
                    <input type="text" class="form-control" id="searchInput" placeholder="Search by feature name...">
                </div>
                <div class="col-md-2">
                    <label for="filterRole" class="form-label">Role</label>
                    <select class="form-select" id="filterRole">
                        <option value="">All Roles</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="filterFeature" class="form-label">Feature</label>
                    <select class="form-select" id="filterFeature">
                        <option value="">All Features</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="filterValue" class="form-label">Value</label>
                    <select class="form-select" id="filterValue">
                        <option value="">All Values</option>
                        <option value="true">Enabled</option>
                        <option value="false">Disabled</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-secondary w-100" id="clearFiltersBtn">
                        <i class="fas fa-times me-1"></i>Clear
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Features table -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover" id="featuresTable">
                    <thead>
                        <tr>
                            <th>Feature Name</th>
                            <th>Role</th>
                            <th>Value</th>
                            <th>Description</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="featuresTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav aria-label="Features pagination" class="mt-3">
        <ul class="pagination justify-content-center flex-wrap" id="pagination"></ul>
    </nav>
</div>

<!-- Add/Edit Feature Modal (content loaded by router via route-name) -->
<div class="modal fade" id="featureModal" tabindex="-1" role="dialog" aria-labelledby="featureModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" route-name="role-feature-modal"></div>

<!-- Delete confirmation modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">Confirm Delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this feature assignment? This action cannot be undone.</p>
                <div class="alert alert-warning mb-0">
                    <i class="fas fa-exclamation-triangle me-1"></i>
                    <strong>Warning:</strong> Deleting this feature will affect all users with the associated role.
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
                    <i class="fas fa-trash me-1"></i>Delete Feature
                </button>
            </div>
        </div>
    </div>
</div>
