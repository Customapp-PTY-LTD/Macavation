<!-- Sales Forecasting Grid Module -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Sales Forecasting</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <a href="help/index.html#sales-forecasting-grid" class="btn btn-sm btn-outline-secondary me-2 macavation-help-link" title="User guide"><i class="fas fa-circle-question me-1"></i>Help</a>
            <button type="button" class="btn btn-primary" id="addForecastBtn">
                <i class="fas fa-plus me-1"></i>New Forecast
            </button>
            <button type="button" class="btn btn-outline-secondary" id="exportForecastsBtn" onclick="salesForecastingGrid.exportForecasts()">
                <i class="fas fa-download me-1"></i>Export
            </button>
        </div>
    </div>
    <div class="card mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover" id="forecastsTable">
                    <thead>
                        <tr>
                            <th>Forecast Period</th>
                            <th>Product Type</th>
                            <th>Forecasted Quantity (kg)</th>
                            <th>Confidence Level</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="forecastsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
