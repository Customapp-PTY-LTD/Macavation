<div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0">Data Import (Excel)</h2>
        <div class="btn-toolbar mb-0">
            <a target="_blank" rel="noopener noreferrer" href="help/index.html#data-import-grid" class="btn btn-sm btn-outline-secondary me-2 macavation-help-link" title="User guide"><i class="fas fa-circle-question me-1"></i>Help</a>
            <button class="btn btn-outline-secondary btn-sm" id="downloadTemplateBtn">
                <i class="fas fa-file-download me-1"></i>Download Template
            </button>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-header">
            <h6 class="mb-0">1) Upload Excel File</h6>
        </div>
        <div class="card-body">
            <div class="row g-3 align-items-center">
                <div class="col-md-6">
                    <input type="file" class="form-control" id="excelFileInput" accept=".xlsx,.xls,.csv">
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="targetTableSelect">
                        <option value="">Select target table</option>
                        <option value="contacts">contacts</option>
                        <option value="stock_items">stock_items</option>
                        <option value="oil_production_sheets">oil_production_sheets</option>
                        <option value="receiving_checklists">receiving_checklists</option>
                        <option value="raw_material_issued">raw_material_issued</option>
                        <option value="kernel_production_job_cards">kernel_production_job_cards</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100" id="loadPreviewBtn">
                        <i class="fas fa-eye me-1"></i>Preview
                    </button>
                </div>
            </div>
            <div class="form-text mt-2">Select an Excel file; the first sheet will be parsed. Choose a target table to map columns.</div>
        </div>
    </div>

    <div class="card mb-3" id="mappingCard" style="display:none;">
        <div class="card-header">
            <h6 class="mb-0">2) Map Columns</h6>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Excel Column</th>
                            <th>Sample Value</th>
                            <th>Map to Table Column</th>
                        </tr>
                    </thead>
                    <tbody id="mappingTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card mb-3" id="previewCard" style="display:none;">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h6 class="mb-0">3) Preview Data</h6>
            <div>
                <span class="badge bg-secondary me-2" id="rowCountBadge">0 rows</span>
                <button class="btn btn-success btn-sm" id="importBtn">
                    <i class="fas fa-database me-1"></i>Import
                </button>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive" style="max-height: 50vh; overflow:auto;">
                <table class="table align-middle table-bordered " id="previewTable">
                    <thead id="previewHead"></thead>
                    <tbody id="previewBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
