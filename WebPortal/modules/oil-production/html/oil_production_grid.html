<!-- Oil Production Grid Module (implementation aligned with kernel-production; UI follows UI_DESIGN_INSTRUCTIONS.md) -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Oil Production Workflow</h1>
        <div class="btn-toolbar mb-2 mb-md-0 ms-auto">
            <button type="button" class="btn btn-primary" id="addOilBatchBtn">
                <i class="fas fa-plus me-1"></i>New Oil Production Sheet
            </button>
            <button type="button" class="btn btn-outline-secondary" id="exportOilBatchesBtn">
                <i class="fas fa-download me-1"></i>Export
            </button>
        </div>
    </div>

    <!-- Search and Filters -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="searchOilBatchesInput" class="form-label">Search</label>
                    <input type="text" class="form-control" id="searchOilBatchesInput" placeholder="Search by batch number, product, or status...">
                </div>
                <div class="col-md-3">
                    <label for="filterOilBatchStatus" class="form-label">Status</label>
                    <select class="form-select" id="filterOilBatchStatus">
                        <option value="">All Statuses</option>
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-secondary w-100" id="clearOilBatchFiltersBtn">
                        <i class="fas fa-times me-1"></i>Clear
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-4 oil-production-grid-card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover" id="oilBatchesTable">
                    <thead>
                        <tr>
                            <th>Batch Number</th>
                            <th>Date</th>
                            <th>Shift</th>
                            <th>Product</th>
                            <th>Oil Produced (L)</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="oilBatchesTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Oil Production Sheet Modal (content loaded by app router from modal-oil-production) -->
<div class="modal fade" data-bs-backdrop="static" data-bs-keyboard="false" id="oilProductionModal" role="dialog" route-name="oil-production-sheet-modal" tabindex="-1" aria-labelledby="oilProductionModalLabel" aria-hidden="true"></div>
