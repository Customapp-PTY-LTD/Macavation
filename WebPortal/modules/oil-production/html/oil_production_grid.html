<!-- Oil Production: raw ingredients in production, person on duty, oil bins -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Oil Production</h1>
        <div class="btn-toolbar mb-2 mb-md-0 ms-auto">
            <button type="button" class="btn btn-outline-secondary" id="opRefreshBtn">
                <i class="fas fa-sync-alt me-1"></i>Refresh
            </button>
        </div>
    </div>

    <!-- 1. Raw ingredients in production (released from Supplier Intake) -->
    <div class="card mb-4">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="fas fa-boxes me-2"></i>Raw ingredients in production</h5>
        </div>
        <div class="card-body">
            <p class="text-muted small mb-3">Batches sent through from Supplier Intake for use in oil extraction.</p>
            <div id="opRawIngredientsList" class="op-raw-list">
                <p class="text-muted mb-0">Loading…</p>
            </div>
        </div>
    </div>

    <!-- 2. Person on duty (for the day) -->
    <div class="card mb-4">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="fas fa-user-clock me-2"></i>Person on duty</h5>
        </div>
        <div class="card-body">
            <form id="opPersonOnDutyForm" class="row g-3">
                <div class="col-md-3">
                    <label for="opDutyDate" class="form-label">Date</label>
                    <input type="text" class="form-control flatpickr-date" id="opDutyDate" data-input placeholder="dd/mm/yyyy">
                </div>
                <div class="col-md-4">
                    <label for="opPersonOnDuty" class="form-label">Person on duty</label>
                    <input type="text" class="form-control" id="opPersonOnDuty" placeholder="Name of person on duty">
                </div>
                <div class="col-md-3">
                    <label for="opShiftName" class="form-label">Shift name</label>
                    <input type="text" class="form-control" id="opShiftName" placeholder="e.g. Day shift">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" class="btn btn-primary w-100" id="opSaveDutyBtn">
                        <i class="fas fa-save me-1"></i>Save
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 3. Oil bins being produced -->
    <div class="card mb-4">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="fas fa-tint me-2"></i>Oil bins</h5>
        </div>
        <div class="card-body">
            <p class="text-muted small mb-3">Storage bins for oil produced.</p>
            <div id="opOilBinsList" class="op-bins-list">
                <p class="text-muted mb-0">Loading…</p>
            </div>
        </div>
    </div>
</div>
