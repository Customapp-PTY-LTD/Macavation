<!-- Financial Management Grid Module -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Financial Management</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <a href="help/index.html#financial-management-grid" class="btn btn-sm btn-outline-secondary me-2 macavation-help-link" title="User guide"><i class="fas fa-circle-question me-1"></i>Help</a>
            <button type="button" class="btn btn-primary" id="addInvoiceBtn">
                <i class="fas fa-plus me-1"></i>New Invoice
            </button>
            <button type="button" class="btn btn-secondary" id="addPaymentBtn">
                <i class="fas fa-money-bill me-1"></i>Record Payment
            </button>
            <button type="button" class="btn btn-outline-secondary" id="exportTransactionsBtn">
                <i class="fas fa-download me-1"></i>Export
            </button>
        </div>
    </div>
    <div class="card mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover" id="financialTable">
                    <thead>
                        <tr>
                            <th>Document Number</th>
                            <th>Type</th>
                            <th>Contact</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="financialTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
