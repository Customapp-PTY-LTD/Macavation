<!-- Quality Assurance Grid Module -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Quality Assurance & Food Safety</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <a target="_blank" rel="noopener noreferrer" href="help/index.html#quality-assurance-grid" class="btn btn-sm btn-outline-secondary me-2 macavation-help-link" title="User guide"><i class="fas fa-circle-question me-1"></i>Help</a>
            <button type="button" class="btn btn-primary" id="addTestBtn">
                <i class="fas fa-plus me-1"></i>New Quality Test
            </button>
            <button type="button" class="btn btn-outline-secondary" id="exportTestsBtn" onclick="qualityAssuranceGrid.exportTests()">
                <i class="fas fa-download me-1"></i>Export
            </button>
        </div>
    </div>
    
    <!-- Search and Filters -->
    <div class="card mb-3 mac-module-filter-bar">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="searchTestsInput" class="form-label">Search</label>
                    <input type="text" class="form-control" id="searchTestsInput" placeholder="Search by test number, batch, or result...">
                </div>
                <div class="col-md-3">
                    <label for="filterTestType" class="form-label">Test Type</label>
                    <select class="form-select" id="filterTestType">
                        <option value="">All Types</option>
                        <option value="sample">Sample</option>
                        <option value="batch">Batch</option>
                        <option value="final_product">Final Product</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="filterTestResult" class="form-label">Result</label>
                    <select class="form-select" id="filterTestResult">
                        <option value="">All Results</option>
                        <option value="pass">Pass</option>
                        <option value="conditional_pass">Conditional Pass</option>
                        <option value="fail">Fail</option>
                        <option value="pending">Pending</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-secondary w-100" id="clearTestFiltersBtn">
                        <i class="fas fa-times me-1"></i>Clear
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table align-middle table-hover" id="testsTable">
                    <thead>
                        <tr>
                            <th>Test Number</th>
                            <th>Test Type</th>
                            <th>Product Type</th>
                            <th>Batch Number</th>
                            <th>Test Date</th>
                            <th>Overall Result</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="testsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Quality Test Modal (content loaded by router via route-name) -->
<div class="modal fade" id="qualityTestModal" tabindex="-1" role="dialog" aria-labelledby="qualityTestModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" route-name="quality-test-modal"></div>
