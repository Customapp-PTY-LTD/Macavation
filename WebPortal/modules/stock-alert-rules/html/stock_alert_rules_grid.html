<!-- Stock Alert Rules admin: configure red-flag thresholds per product/style -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Stock Alert Rules</h1>
        <div class="btn-toolbar mb-2 mb-md-0 ms-auto">
            <a href="help/index.html#stock-alert-rules-grid" class="btn btn-sm btn-outline-secondary me-2 macavation-help-link" title="User guide"><i class="fas fa-circle-question me-1"></i>Help</a>
            <button type="button" class="btn btn-outline-secondary me-2" id="refreshStockAlertRulesBtn">
                <i class="fas fa-sync-alt me-1"></i>Refresh
            </button>
            <button type="button" class="btn btn-primary" id="addStockAlertRuleBtn">
                <i class="fas fa-plus me-1"></i>Add Rule
            </button>
        </div>
    </div>

    <div class="alert alert-info py-2 px-3 small mb-3">
        <i class="fas fa-circle-info me-1"></i>
        When stock on hand falls at or below the minimum, a dashboard alert is raised (once per day per rule).
        Stock grids evaluate rules automatically after each refresh.
    </div>

    <div class="card mb-4">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="stockAlertRulesTable">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Style</th>
                            <th style="width:120px">Min qty</th>
                            <th>Unit</th>
                            <th>Severity</th>
                            <th>Active</th>
                            <th style="width:120px" class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="stockAlertRulesTableBody">
                        <tr><td colspan="7" class="text-center text-muted py-4">
                            <i class="fas fa-spinner fa-spin me-2"></i>Loading rules...
                        </td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
