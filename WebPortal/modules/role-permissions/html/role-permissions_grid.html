<!-- Role Permissions Grid Module -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Role Permissions</h1>
        <div class="btn-toolbar mb-2 mb-md-0 ms-auto">
            <a target="_blank" rel="noopener noreferrer" href="help/index.html#role-permissions-grid" class="btn btn-sm btn-outline-secondary me-2 macavation-help-link" title="User guide"><i class="fas fa-circle-question me-1"></i>Help</a>
            <button type="button" class="btn btn-outline-secondary" id="exportPermissionsBtn">
                <i class="fas fa-download me-1"></i>Export
            </button>
            <button type="button" class="btn btn-outline-secondary" id="refreshPermissionsBtn">
                <i class="fas fa-sync-alt me-1"></i>Refresh
            </button>
            <button type="button" class="btn btn-primary" id="addPermissionBtn">
                <i class="fas fa-plus me-1"></i>Add Permission
            </button>
        </div>
    </div>

    <!-- Search and filters -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label for="searchInput" class="form-label">Search</label>
                    <input type="text" class="form-control" id="searchInput" placeholder="Search by object name, role...">
                </div>
                <div class="col-md-2">
                    <label for="filterRole" class="form-label">Role</label>
                    <select class="form-select" id="filterRole">
                        <option value="">All Roles</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="filterObjectType" class="form-label">Object Type</label>
                    <select class="form-select" id="filterObjectType">
                        <option value="">All Types</option>
                        <option value="function">function</option>
                        <option value="table">table</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="filterPermission" class="form-label">Operation</label>
                    <select class="form-select" id="filterPermission">
                        <option value="">All</option>
                        <option value="EXECUTE">EXECUTE</option>
                        <option value="Read">Read</option>
                        <option value="Create">Create</option>
                        <option value="Update">Update</option>
                        <option value="Delete">Delete</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-secondary w-100" id="clearFiltersBtn">
                        <i class="fas fa-times me-1"></i>Clear
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Permissions table -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table align-middle table-hover" id="permissionsTable">
                    <thead>
                        <tr>
                            <th>Object Name</th>
                            <th>Role</th>
                            <th>Object Type</th>
                            <th>Permission</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="permissionsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav aria-label="Permissions pagination" class="mt-3">
        <ul class="pagination justify-content-center flex-wrap" id="pagination"></ul>
    </nav>
</div>

<!-- Add/Edit Permission Modal (content loaded by router via route-name) -->
<div class="modal fade" id="permissionModal" tabindex="-1" role="dialog" aria-labelledby="permissionModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" route-name="role-permission-modal"></div>

<!-- Delete confirmation modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">Confirm Delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this permission? This action cannot be undone.</p>
                <div class="alert alert-warning mb-0">
                    <i class="fas fa-exclamation-triangle me-1"></i>
                    <strong>Warning:</strong> Deleting this permission will affect all users with the associated role.
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
                    <i class="fas fa-trash me-1"></i>Delete Permission
                </button>
            </div>
        </div>
    </div>
</div>
