<!-- In-app messaging compose — send notifications to users or roles -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Send Message</h1>
        <div class="btn-toolbar mb-2 mb-md-0 ms-auto">
            <a href="help/index.html#messaging-compose-grid" class="btn btn-sm btn-outline-secondary me-2 macavation-help-link" title="User guide"><i class="fas fa-circle-question me-1"></i>Help</a>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-7">
            <div class="card mb-4">
                <div class="card-header bg-light"><strong>Compose</strong></div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Send to</label>
                        <select class="form-select" id="msgTargetType">
                            <option value="broadcast">All users (broadcast)</option>
                            <option value="role">Role</option>
                            <option value="user">Specific user</option>
                        </select>
                    </div>
                    <div class="mb-3 d-none" id="msgRoleWrap">
                        <label class="form-label">Role</label>
                        <select class="form-select" id="msgRoleSelect"><option value="">Loading roles...</option></select>
                    </div>
                    <div class="mb-3 d-none" id="msgUserWrap">
                        <label class="form-label">User</label>
                        <select class="form-select" id="msgUserSelect"><option value="">Loading users...</option></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-control" id="msgTitle" maxlength="200" placeholder="Subject line">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" id="msgBody" rows="4" maxlength="2000" placeholder="Message body"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Link route (optional)</label>
                        <input type="text" class="form-control" id="msgLinkRoute" placeholder="e.g. stock-management-grid or batch-journey-grid">
                        <div class="form-text">Opens this screen when the recipient clicks the notification.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Severity</label>
                        <select class="form-select" id="msgSeverity">
                            <option value="info">Info</option>
                            <option value="warning">Warning</option>
                            <option value="critical">Critical</option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-primary" id="msgSendBtn" data-action-perm="messaging.broadcast">
                        <i class="fas fa-paper-plane me-1"></i>Send
                    </button>
                </div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card">
                <div class="card-header bg-light d-flex justify-content-between align-items-center">
                    <strong>Recent sent</strong>
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="msgRefreshSentBtn"><i class="fas fa-sync-alt"></i></button>
                </div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush" id="msgRecentList">
                        <li class="list-group-item text-muted small">Use the header bell to read incoming messages.</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
