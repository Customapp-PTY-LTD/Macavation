<!-- Oil & Protein Dispatch (UI follows UI_DESIGN_INSTRUCTIONS.md) -->
<!-- INV from W/House Finished (OIL PROTEIN R YES) → FEED+OIL+PROTEIN CUSTOMERS → DEBTORS -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Oil &amp; Protein Dispatch</h1>
        <div class="btn-toolbar mb-2 mb-md-0 ms-auto">
            <button type="button" class="btn btn-primary" id="newDispatchBtn" disabled title="Coming soon">
                <i class="fas fa-plus me-1"></i>New Dispatch
            </button>
            <button type="button" class="btn btn-outline-secondary" id="exportDispatchBtn" disabled title="Coming soon">
                <i class="fas fa-download me-1"></i>Export
            </button>
        </div>
    </div>

    <!-- Filters -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="searchDispatchInput" class="form-label">Search</label>
                    <input type="text" class="form-control" id="searchDispatchInput" placeholder="Search by reference, customer...">
                </div>
                <div class="col-md-3">
                    <label for="filterDispatchStatus" class="form-label">Status</label>
                    <select class="form-select" id="filterDispatchStatus">
                        <option value="">All Statuses</option>
                        <option value="draft">Draft</option>
                        <option value="dispatched">Dispatched</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-secondary w-100" id="clearDispatchFiltersBtn">
                        <i class="fas fa-times me-1"></i>Clear
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main table -->
    <div class="card mb-4 oil-dispatch-grid-card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover" id="oilDispatchTable">
                    <thead>
                        <tr>
                            <th>Reference</th>
                            <th>Date</th>
                            <th>Customer</th>
                            <th>Product</th>
                            <th>Quantity</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="oilDispatchTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
