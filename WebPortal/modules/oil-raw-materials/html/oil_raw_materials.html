<!-- Oil Raw Materials: stock levels, weekly overview, month-end count, daily recipe, supplier recon (oil_raw_materials.js, oil_raw_recon.js). -->
<div class="module-content" id="oilRawMaterialsModule">
    <div class="pt-3 pb-2 mb-3 border-bottom">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center">
            <h1 class="h2 mb-0">Raw Materials</h1>
        </div>
        <p class="text-muted mb-0 mt-2 small">Step 2 of 5 on the oil side. Bags arrive in <strong>Receiving</strong>, wait here until their FFA test passes, and are moved to <strong>Production</strong> once weighed.</p>
    </div>

    <div role="tablist" aria-label="Sections" class="or-tabs">
        <button type="button" role="tab" class="or-tab" id="orTabStock" aria-selected="true" aria-controls="orPane_stock" data-or-tab="stock">Stock levels</button>
        <button type="button" role="tab" class="or-tab" id="orTabWeekly" aria-selected="false" aria-controls="orPane_weekly" data-or-tab="weekly">Weekly overview</button>
        <button type="button" role="tab" class="or-tab" id="orTabCount" aria-selected="false" aria-controls="orPane_count" data-or-tab="count">Month-end count</button>
        <button type="button" role="tab" class="or-tab" id="orTabRecipe" aria-selected="false" aria-controls="orPane_recipe" data-or-tab="recipe">Daily recipe</button>
        <button type="button" role="tab" class="or-tab" id="orTabRecon" aria-selected="false" aria-controls="orPane_recon" data-or-tab="recon">Supplier recon</button>
    </div>

    <div id="orPane_stock" role="tabpanel" aria-labelledby="orTabStock"></div>
    <div id="orPane_weekly" role="tabpanel" aria-labelledby="orTabWeekly" class="d-none"></div>
    <div id="orPane_count" role="tabpanel" aria-labelledby="orTabCount" class="d-none"></div>
    <div id="orPane_recipe" role="tabpanel" aria-labelledby="orTabRecipe" class="d-none"></div>
    <!-- Kg received per supplier and month, for invoice checks (rendered by oil_raw_recon.js) -->
    <div id="orPane_recon" role="tabpanel" aria-labelledby="orTabRecon" class="d-none"></div>

    <!-- Move bags to Production: weigh every bag before it goes -->
    <div class="modal fade" id="orMoveModal" tabindex="-1" aria-labelledby="orMoveModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="orMoveModalTitle">Move bags to Production</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="orMoveModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="orMoveConfirmBtn"><i class="fas fa-arrow-right me-1" aria-hidden="true"></i>Move to Production</button>
                </div>
            </div>
        </div>
    </div>
</div>
