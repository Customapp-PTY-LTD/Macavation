<div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="linkSampleToBatchModalLabel">New sample submission</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <p class="text-muted small mb-3">Link an existing sample submission to this batch. You can create samples in the table above first.</p>
            <label for="linkSampleToBatchSelect" class="form-label">Sample</label>
            <select class="form-select" id="linkSampleToBatchSelect">
                <option value="">Select a sample to link…</option>
            </select>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="linkSampleToBatchBtn"><i class="fas fa-link me-1"></i>Link to batch</button>
        </div>
    </div>
</div>
