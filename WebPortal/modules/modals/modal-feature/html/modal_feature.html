<div class="modal-dialog modal-lg">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="featureModalLabel">Add New Feature</h5>
            <a href="help/index.html#modal-feature" class="btn btn-sm btn-outline-secondary ms-auto me-2 macavation-help-link" title="User guide"><i class="fas fa-circle-question me-1"></i>Help</a>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form id="featureForm">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-section">
                            <h5>Feature Information</h5>
                            <div class="mb-3">
                                <label for="featureKey" class="form-label required">Key</label>
                                <input type="text" class="form-control" id="featureKey" placeholder="e.g. kernel-production-grid" required>
                                <small class="form-text text-muted">Route name used in the sidebar. Must be unique.</small>
                            </div>
                            <div class="mb-3">
                                <label for="featureName" class="form-label required">Name</label>
                                <input type="text" class="form-control" id="featureName" placeholder="e.g. Kernel Production" required>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-section">
                            <h5>Details</h5>
                            <div class="mb-3">
                                <label for="featureDescription" class="form-label">Description</label>
                                <textarea class="form-control" id="featureDescription" rows="3" placeholder="What this feature/module does..."></textarea>
                            </div>
                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="featureIsActive" checked>
                                    <label class="form-check-label" for="featureIsActive">
                                        Active
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="saveFeatureBtn">
                <i class="fas fa-save me-1"></i>Save Feature
            </button>
        </div>
    </div>
</div>
