<div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="kernelDispatchEditModalLabel">Edit dispatch order</h5>
            <a target="_blank" rel="noopener noreferrer" href="help/index.html#modal-kernel-dispatch-edit" class="btn btn-sm btn-outline-secondary ms-auto me-2 macavation-help-link" title="User guide"><i class="fas fa-circle-question me-1"></i>Help</a>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <p class="text-muted small mb-3">Change buyer, delivery dates, or carton quantities. You cannot edit an order after it has been dispatched.</p>
            <input type="hidden" id="kernelDispatchEditOrderId" value="">
            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label class="form-label" for="kernelDispatchEditBuyer">Buyer</label>
                    <input type="text" class="form-control form-control-sm" id="kernelDispatchEditBuyer" maxlength="500" autocomplete="organization">
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="kernelDispatchEditDelivery">Delivery date</label>
                    <input type="text" class="form-control form-control-sm" id="kernelDispatchEditDelivery" placeholder="dd/mm/yyyy">
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="kernelDispatchEditBestBefore">Best before</label>
                    <input type="text" class="form-control form-control-sm" id="kernelDispatchEditBestBefore" placeholder="dd/mm/yyyy">
                </div>
            </div>
            <div class="table-responsive">
                <table class="table align-middle table-bordered align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Batch</th>
                            <th>Style</th>
                            <th class="text-end" style="width:8rem">Cartons</th>
                            <th class="text-end" style="width:11rem"><span class="visually-hidden">Line actions</span></th>
                        </tr>
                    </thead>
                    <tbody id="kernelDispatchEditLinesBody"></tbody>
                </table>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="kernelDispatchEditSaveBtn">Save changes</button>
        </div>
    </div>
</div>
