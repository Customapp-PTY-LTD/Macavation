<div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="oilDispatchFormModalLabel">Inspection of Vehicle &amp; Dispatch</h5>
            <a target="_blank" rel="noopener noreferrer" href="help/index.html#modal-oil-dispatch-form" class="btn btn-sm btn-outline-secondary ms-auto me-2 macavation-help-link" title="User guide"><i class="fas fa-circle-question me-1"></i>Help</a>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form id="oilDispatchFormForm">
                <input type="hidden" id="oilDispatchFormOrderId" value="">
                <div class="card mb-3" id="oilDispatchFormBasketCard">
                    <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <h6 class="mb-0">Order lines (basket)</h6>
                        <span class="text-muted small" id="oilDispatchFormOrderMeta"></span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table align-middle table-striped mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Batch</th>
                                        <th>Product</th>
                                        <th class="text-end">Quantity</th>
                                    </tr>
                                </thead>
                                <tbody id="oilDispatchFormBasketBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="card mb-3">
                    <div class="card-header"><h6 class="mb-0">Inspection of Vehicle</h6></div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6" id="oilDspInspColA"></div>
                            <div class="col-md-6" id="oilDspInspColB"></div>
                        </div>
                    </div>
                </div>
                <div class="card mb-3">
                    <div class="card-header"><h6 class="mb-0">Dispatch</h6></div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="oilDispatchPerson" class="form-label">Attention</label>
                                    <input type="text" class="form-control" id="oilDispatchPerson" placeholder="Name">
                                </div>
                                <div class="mb-3">
                                    <label for="oilDispatchCell" class="form-label">Cell number</label>
                                    <input type="tel" class="form-control" id="oilDispatchCell" placeholder="Cell number">
                                </div>
                                <div class="mb-3">
                                    <label for="oilDspTransportSelect" class="form-label">Transport company</label>
                                    <select class="form-select" id="oilDspTransportSelect"><option value="">Select transport company</option></select>
                                    <input type="text" class="form-control d-none" id="oilDspTransportText" placeholder="Company name">
                                    <button type="button" class="btn btn-link btn-sm p-0 mt-1" id="oilDspTransportAddBtn">+ Add transport company</button>
                                    <div class="input-group input-group-sm mt-1 d-none" id="oilDspTransportAddForm">
                                        <input type="text" class="form-control" id="oilDspTransportAddName" placeholder="New company name" aria-label="New transport company name">
                                        <button type="button" class="btn btn-primary" id="oilDspTransportAddSave">Add</button>
                                        <button type="button" class="btn btn-outline-secondary" id="oilDspTransportAddCancel">Cancel</button>
                                    </div>
                                    <div class="text-danger small d-none" id="oilDspTransportAddError"></div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="oilDispatchDateDispatched" class="form-label">Date dispatched</label>
                                    <input type="text" class="form-control flatpickr-date" id="oilDispatchDateDispatched" placeholder="dd/mm/yyyy" data-input>
                                </div>
                                <div class="mb-3">
                                    <label for="oilDispatchTruckReg" class="form-label">Truck Registration</label>
                                    <input type="text" class="form-control" id="oilDispatchTruckReg" placeholder="Registration">
                                </div>
                                <div class="mb-3">
                                    <label for="oilDispatchDeliveryNote" class="form-label">Delivery note / Invoice number</label>
                                    <input type="text" class="form-control" id="oilDispatchDeliveryNote" placeholder="Number">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="oilDispatchTime" class="form-label">Time</label>
                                    <input type="time" class="form-control" id="oilDispatchTime">
                                </div>
                                <div class="mb-3">
                                    <label for="oilDispatchDispatchedTo" class="form-label">Dispatched to</label>
                                    <input type="text" class="form-control" id="oilDispatchDispatchedTo" placeholder="Customer / buyer">
                                </div>
                                <div class="mb-3">
                                    <label for="oilDispatchDriverName" class="form-label">Driver's Name</label>
                                    <input type="text" class="form-control" id="oilDispatchDriverName" placeholder="Name">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label" for="oilDspSigCanvas">Sender's Signature</label>
                                <div class="text-muted small d-none" id="oilDspSigLegacy">Previously recorded as: <span id="oilDspSigLegacyName"></span></div>
                                <canvas class="border rounded w-100 bg-white d-block" id="oilDspSigCanvas"></canvas>
                                <button type="button" class="btn btn-sm btn-outline-secondary mt-1" id="oilDspSigClear">Clear</button>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="oilDspAttachInput">Attachments</label>
                                <div id="oilDspAttachAddWrap">
                                    <input type="file" class="form-control form-control-sm" id="oilDspAttachInput" accept="image/*,application/pdf" multiple>
                                    <div class="form-text">Images or PDF documents, up to 6 MB each.</div>
                                </div>
                                <div class="text-danger small mt-1 d-none" id="oilDspAttachError"></div>
                                <div class="mt-2" id="oilDspAttachList"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="oilDispatchFormCancelBtn" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="oilDispatchFormSubmitBtn" title="Save inspection and dispatch details and mark order as dispatched"><i class="fas fa-truck me-1"></i>Save &amp; dispatch</button>
        </div>
    </div>
</div>
