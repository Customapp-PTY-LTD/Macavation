<div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="createKernelBatchModalLabel">Create kernel batch</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form id="createKernelBatchForm">
                <div class="mb-3">
                    <label for="intakeBatchNumber" class="form-label">Batch number</label>
                    <input type="text" class="form-control" id="intakeBatchNumber" placeholder="e.g. BATCH-2025-02-001" required>
                </div>
                <div class="mb-3">
                    <label for="intakeBatchReceivedDate" class="form-label">Received date</label>
                    <input type="date" class="form-control" id="intakeBatchReceivedDate" required>
                </div>
                <div class="mb-3">
                    <label for="intakeBatchGrower" class="form-label">Grower / supplier</label>
                    <select class="form-select" id="intakeBatchGrower">
                        <option value="">Select (optional)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="intakeBatchWetNis" class="form-label">Wet NIS (kg)</label>
                    <input type="number" class="form-control" id="intakeBatchWetNis" step="0.01" min="0.01" required>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="saveCreateKernelBatchBtn"><i class="fas fa-save me-1"></i>Create batch</button>
        </div>
    </div>
</div>
