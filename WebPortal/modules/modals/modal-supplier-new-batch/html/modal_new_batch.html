<div class="modal-dialog modal-xl">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="newBatchProductModalLabel">New batch of product</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form id="newBatchProductForm">
                <div class="card mb-3">
                    <div class="card-header"><h6 class="mb-0">Product &amp; delivery</h6></div>
                    <div class="card-body">
                        <div class="row g-2">
                            <div class="col-md-3">
                                <label for="newBatchProductType" class="form-label required">Product type</label>
                                <select class="form-select" id="newBatchProductType" required>
                                    <option value="">Select product…</option>
                                    <option value="oil_kernel">Oil kernel</option>
                                    <option value="cracker_dust">Cracker dust</option>
                                    <option value="kernel_dust">Kernel dust</option>
                                    <option value="crush">Crush</option>
                                    <option value="cake">Cake</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="newBatchDateReceived" class="form-label required">Date received</label>
                                <input type="text" class="form-control flatpickr-date" id="newBatchDateReceived" data-input required placeholder="dd/mm/yyyy">
                            </div>
                            <div class="col-md-3">
                                <label for="newBatchDeliveryNoteRef" class="form-label">Delivery note reference / PO number</label>
                                <input type="text" class="form-control" id="newBatchDeliveryNoteRef" placeholder="e.g. PO-12345">
                            </div>
                            <div class="col-md-3">
                                <label for="newBatchSupplier" class="form-label">Supplier details</label>
                                <select class="form-select" id="newBatchSupplier">
                                    <option value="">Select supplier</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card mb-3">
                    <div class="card-header"><h6 class="mb-0">Vehicle &amp; receiving checks</h6></div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Is the vehicle clean?</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="newBatchVehicleClean" id="newBatchVehicleCleanYes" value="Yes">
                                            <label class="form-check-label" for="newBatchVehicleCleanYes">Yes</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="newBatchVehicleClean" id="newBatchVehicleCleanNo" value="No">
                                            <label class="form-check-label" for="newBatchVehicleCleanNo">No</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Vehicle fully enclosed?</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="newBatchVehicleEnclosed" id="newBatchVehicleEnclosedYes" value="Yes">
                                            <label class="form-check-label" for="newBatchVehicleEnclosedYes">Yes</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="newBatchVehicleEnclosed" id="newBatchVehicleEnclosedNo" value="No">
                                            <label class="form-check-label" for="newBatchVehicleEnclosedNo">No</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Any hazard substances noted on truck?</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="newBatchHazardSubstances" id="newBatchHazardSubstancesYes" value="Yes">
                                            <label class="form-check-label" for="newBatchHazardSubstancesYes">Yes</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="newBatchHazardSubstances" id="newBatchHazardSubstancesNo" value="No">
                                            <label class="form-check-label" for="newBatchHazardSubstancesNo">No</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Any signs of pest infestations?</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="newBatchPestInfestations" id="newBatchPestInfestationsYes" value="Yes">
                                            <label class="form-check-label" for="newBatchPestInfestationsYes">Yes</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="newBatchPestInfestations" id="newBatchPestInfestationsNo" value="No">
                                            <label class="form-check-label" for="newBatchPestInfestationsNo">No</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Pallets received are in good condition</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="newBatchPalletsCondition" id="newBatchPalletsConditionYes" value="Yes">
                                            <label class="form-check-label" for="newBatchPalletsConditionYes">Yes</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="newBatchPalletsCondition" id="newBatchPalletsConditionNo" value="No">
                                            <label class="form-check-label" for="newBatchPalletsConditionNo">No</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Are raw materials received in good condition?</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="newBatchRawMaterialsCondition" id="newBatchRawMaterialsConditionYes" value="Yes">
                                            <label class="form-check-label" for="newBatchRawMaterialsConditionYes">Yes</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="newBatchRawMaterialsCondition" id="newBatchRawMaterialsConditionNo" value="No">
                                            <label class="form-check-label" for="newBatchRawMaterialsConditionNo">No</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mb-0">
                            <label for="newBatchReceivingComments" class="form-label">Comments / actions taken</label>
                            <textarea class="form-control" id="newBatchReceivingComments" rows="2"></textarea>
                        </div>
                    </div>
                </div>
                <div class="card mb-3">
                    <div class="card-header"><h6 class="mb-0">Product item details</h6></div>
                    <div class="card-body">
                        <div class="row g-2">
                            <div class="col-md-2"><label for="newBatchReference" class="form-label">Reference / PO</label><input type="text" class="form-control form-control-sm" id="newBatchReference"></div>
                            <div class="col-md-2"><label for="newBatchDescription" class="form-label">Description</label><input type="text" class="form-control form-control-sm" id="newBatchDescription" placeholder="e.g. product description"></div>
                            <div class="col-md-2"><label for="newBatchBatchNumber" class="form-label">Batch</label><input type="text" class="form-control form-control-sm" id="newBatchBatchNumber"></div>
                            <div class="col-md-2"><label for="newBatchCartonBags" class="form-label">Carton / bulk bags</label><input type="number" class="form-control form-control-sm" id="newBatchCartonBags" value="1" min="1"></div>
                            <div class="col-md-2"><label for="newBatchQuantityKg" class="form-label">Quantity (kg)</label><input type="number" class="form-control form-control-sm" id="newBatchQuantityKg" step="0.01" min="0"></div>
                            <div class="col-md-2"><label for="newBatchManufacturedDate" class="form-label">Manufactured date</label><input type="text" class="form-control form-control-sm flatpickr-date" id="newBatchManufacturedDate" placeholder="dd/mm/yyyy"></div>
                            <div class="col-md-2"><label for="newBatchBestBeforeDate" class="form-label">Best before date</label><input type="text" class="form-control form-control-sm flatpickr-date" id="newBatchBestBeforeDate" placeholder="dd/mm/yyyy"></div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="saveNewBatchProductBtn"><i class="fas fa-save me-1"></i>Save batch</button>
        </div>
    </div>
</div>
