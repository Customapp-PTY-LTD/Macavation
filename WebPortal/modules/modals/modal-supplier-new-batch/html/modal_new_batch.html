<div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="newBatchProductModalLabel">Create batch</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form id="newBatchProductForm">
                <div class="mb-3">
                    <label for="newBatchBatchNumber" class="form-label">Batch number</label>
                    <input type="text" class="form-control" id="newBatchBatchNumber" placeholder="e.g. OIL-2026-03-001">
                </div>
                <div class="mb-3">
                    <label for="newBatchDateReceived" class="form-label">Received date</label>
                    <input type="date" class="form-control" id="newBatchDateReceived" required>
                </div>
                <div class="mb-3">
                    <label for="newBatchSupplier" class="form-label">Supplier</label>
                    <select class="form-select" id="newBatchSupplier">
                        <option value="">Select (optional)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="newBatchProductType" class="form-label">Product type</label>
                    <select class="form-select" id="newBatchProductType" required>
                        <option value="">Select product…</option>
                        <option value="oil_kernel">Oil kernel</option>
                        <option value="cracker_dust">Cracker dust</option>
                        <option value="kernel_dust">Kernel dust</option>
                        <option value="crush">Crush</option>
                        <option value="cake">Cake</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="newBatchQuantityKg" class="form-label">Quantity (kg)</label>
                    <input type="number" class="form-control" id="newBatchQuantityKg" step="0.01" min="0.01" required>
                </div>
                <div class="mb-3">
                    <label for="newBatchDeliveryNoteRef" class="form-label">Delivery note / PO</label>
                    <input type="text" class="form-control" id="newBatchDeliveryNoteRef" placeholder="e.g. PO-12345">
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="saveNewBatchProductBtn"><i class="fas fa-save me-1"></i>Create batch</button>
        </div>
    </div>
</div>
