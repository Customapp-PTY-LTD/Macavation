<div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="kernelDispatchFormModalLabel">Inspection of Vehicle &amp; Dispatch</h5>
            <a target="_blank" rel="noopener noreferrer" href="help/index.html#modal-kernel-dispatch-form" class="btn btn-sm btn-outline-secondary ms-auto me-2 macavation-help-link" title="User guide"><i class="fas fa-circle-question me-1"></i>Help</a>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form id="kernelDispatchFormForm">
                <input type="hidden" id="kernelDispatchFormOrderId" value="">
                <div class="card mb-3" id="kernelDispatchFormBasketCard">
                    <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <h6 class="mb-0">Order lines (basket)</h6>
                        <span class="text-muted small" id="kernelDispatchFormOrderMeta"></span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table align-middle table-striped mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Batch</th>
                                        <th>Style</th>
                                        <th class="text-end">Quantity</th>
                                    </tr>
                                </thead>
                                <tbody id="kernelDispatchFormBasketBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="card mb-3">
                    <div class="card-header"><h6 class="mb-0">Inspection of Vehicle</h6></div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6" id="kernelDspInspColA"></div>
                            <div class="col-md-6" id="kernelDspInspColB"></div>
                        </div>
                    </div>
                </div>
                <div class="card mb-3">
                    <div class="card-header"><h6 class="mb-0">Dispatch</h6></div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="dispatchPerson" class="form-label">Attention</label>
                                    <input type="text" class="form-control" id="dispatchPerson" placeholder="Name">
                                </div>
                                <div class="mb-3">
                                    <label for="dispatchCell" class="form-label">Cell number</label>
                                    <input type="tel" class="form-control" id="dispatchCell" placeholder="Cell number">
                                </div>
                                <div class="mb-3">
                                    <label for="kernelDspTransportSelect" class="form-label">Transport company</label>
                                    <select class="form-select" id="kernelDspTransportSelect"><option value="">Select transport company</option></select>
                                    <input type="text" class="form-control d-none" id="kernelDspTransportText" placeholder="Company name">
                                    <button type="button" class="btn btn-link btn-sm p-0 mt-1" id="kernelDspTransportAddBtn">+ Add transport company</button>
                                    <div class="input-group input-group-sm mt-1 d-none" id="kernelDspTransportAddForm">
                                        <input type="text" class="form-control" id="kernelDspTransportAddName" placeholder="New company name" aria-label="New transport company name">
                                        <button type="button" class="btn btn-primary" id="kernelDspTransportAddSave">Add</button>
                                        <button type="button" class="btn btn-outline-secondary" id="kernelDspTransportAddCancel">Cancel</button>
                                    </div>
                                    <div class="text-danger small d-none" id="kernelDspTransportAddError"></div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="dispatchDateDispatched" class="form-label">Date dispatched</label>
                                    <input type="text" class="form-control flatpickr-date" id="dispatchDateDispatched" placeholder="dd/mm/yyyy" data-input>
                                </div>
                                <div class="mb-3">
                                    <label for="dispatchTruckReg" class="form-label">Truck Registration</label>
                                    <input type="text" class="form-control" id="dispatchTruckReg" placeholder="Registration">
                                </div>
                                <div class="mb-3">
                                    <label for="dispatchDeliveryNote" class="form-label">Delivery note / Invoice number</label>
                                    <input type="text" class="form-control" id="dispatchDeliveryNote" placeholder="Number">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="dispatchTime" class="form-label">Time</label>
                                    <input type="time" class="form-control" id="dispatchTime">
                                </div>
                                <div class="mb-3">
                                    <label for="dispatchDispatchedTo" class="form-label">Dispatched to</label>
                                    <input type="text" class="form-control" id="dispatchDispatchedTo" placeholder="Customer / buyer">
                                </div>
                                <div class="mb-3">
                                    <label for="dispatchDriverName" class="form-label">Driver's Name</label>
                                    <input type="text" class="form-control" id="dispatchDriverName" placeholder="Name">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label" for="kernelDspSigCanvas">Sender's Signature</label>
                                <div class="text-muted small d-none" id="kernelDspSigLegacy">Previously recorded as: <span id="kernelDspSigLegacyName"></span></div>
                                <canvas class="border rounded w-100 bg-white d-block" id="kernelDspSigCanvas"></canvas>
                                <button type="button" class="btn btn-sm btn-outline-secondary mt-1" id="kernelDspSigClear">Clear</button>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="kernelDspAttachInput">Attachments</label>
                                <div id="kernelDspAttachAddWrap">
                                    <input type="file" class="form-control form-control-sm" id="kernelDspAttachInput" accept="image/*,application/pdf" multiple>
                                    <div class="form-text">Images or PDF documents, up to 6 MB each.</div>
                                </div>
                                <div class="text-danger small mt-1 d-none" id="kernelDspAttachError"></div>
                                <div class="mt-2" id="kernelDspAttachList"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary d-none" id="kernelDispatchFormEditDispatchedBtn" title="Edit: unlock basket—clears dispatch paperwork and returns it to ready to dispatch">Edit</button>
            <button type="button" class="btn btn-secondary" id="kernelDispatchFormCancelBtn" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="kernelDispatchFormSubmitBtn"><i class="fas fa-truck me-1"></i>Save &amp; dispatch</button>
        </div>
    </div>
</div>
