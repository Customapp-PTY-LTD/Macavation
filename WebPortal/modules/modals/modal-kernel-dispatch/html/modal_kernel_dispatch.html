<div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="kernelDispatchModalLabel">Dispatch order</h5>
            <a href="help/index.html#modal-kernel-dispatch" class="btn btn-sm btn-outline-secondary ms-auto me-2 macavation-help-link" title="User guide"><i class="fas fa-circle-question me-1"></i>Help</a>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <div id="kernelDispatchViewBasket" style="display: none;">
                <div class="mb-3">
                    <p class="mb-1"><strong>Buyer:</strong> <span id="kernelDispatchOrderBuyer"></span></p>
                    <p class="mb-1"><strong>Delivery date:</strong> <span id="kernelDispatchOrderDelivery"></span></p>
                    <p class="mb-2"><strong>Status:</strong> <span id="kernelDispatchOrderStatus"></span></p>
                </div>
                <h6 class="text-secondary mb-2">Styles by batch</h6>
                <div class="table-responsive">
                    <table class="table table-sm table-bordered mb-0">
                        <thead class="table-light">
                            <tr><th>Batch</th><th>Style</th><th class="text-end">Qty (kg)</th></tr>
                        </thead>
                        <tbody id="kernelDispatchOrderLinesBody"></tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-end mt-3 pt-3 border-top">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
            <div id="kernelDispatchConfirmBatch" style="display: none;">
                <p class="mb-2">Record INV to customer. Batch will be marked as dispatched.</p>
                <div class="mb-3">
                    <label for="dispatchBatchRef" class="form-label">Customer / reference (optional)</label>
                    <input type="text" class="form-control" id="dispatchBatchRef" placeholder="Customer or INV reference">
                </div>
                <div class="modal-body-actions d-flex justify-content-between flex-wrap align-items-center mt-4 pt-3 border-top gap-2">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="confirmDispatchBtn"><i class="fas fa-truck me-1"></i>Confirm dispatch</button>
                </div>
            </div>
        </div>
    </div>
</div>
