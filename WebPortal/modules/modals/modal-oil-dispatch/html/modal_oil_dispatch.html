<div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="oilDispatchModalLabel">Dispatch order</h5>
            <a target="_blank" rel="noopener noreferrer" href="help/index.html#modal-oil-dispatch" class="btn btn-sm btn-outline-secondary ms-auto me-2 macavation-help-link" title="User guide"><i class="fas fa-circle-question me-1"></i>Help</a>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <div id="oilDispatchViewBasket" style="display: none;">
                <div class="mb-3">
                    <p class="mb-1"><strong>Buyer:</strong> <span id="oilDispatchOrderBuyer"></span></p>
                    <p class="mb-1"><strong>Delivery date:</strong> <span id="oilDispatchOrderDelivery"></span></p>
                    <p class="mb-2"><strong>Status:</strong> <span id="oilDispatchOrderStatus"></span></p>
                </div>
                <h6 class="text-secondary mb-2">Products by batch / lot</h6>
                <div class="table-responsive">
                    <table class="table align-middle table-bordered mb-0">
                        <thead class="table-light">
                            <tr><th>Batch / Lot</th><th>Product / Style</th><th class="text-end">Qty (kg)</th></tr>
                        </thead>
                        <tbody id="oilDispatchOrderLinesBody"></tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-end mt-3 pt-3 border-top">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</div>
