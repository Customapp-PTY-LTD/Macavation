<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header bg-success text-white">
            <h5 class="modal-title" id="sendToDispatchModalLabel"><i class="fas fa-truck me-2"></i>Send to Dispatch</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <!-- Step 1: Buyer and delivery details -->
            <div id="sendToDispatchStep1">
                <div id="sendToDispatchStep1BatchSummary" class="alert alert-light border mb-3 py-2 small" style="display: none;">
                    <strong>Batch:</strong> <span id="sendToDispatchStep1BatchLabel">—</span>
                </div>
                <form id="sendToDispatchForm">
                    <div class="mb-3">
                        <label for="dispatchBuyer" class="form-label required">Buyer</label>
                        <input type="text" class="form-control" id="dispatchBuyer" placeholder="Buyer or customer name" required>
                        <small class="text-muted">Or select from contacts below</small>
                    </div>
                    <div class="mb-3">
                        <label for="dispatchBuyerContact" class="form-label">Buyer (from contacts)</label>
                        <select class="form-select" id="dispatchBuyerContact">
                            <option value="">— Select contact —</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="dispatchDeliveryDate" class="form-label required">Date of delivery</label>
                        <input type="text" class="form-control flatpickr-date" id="dispatchDeliveryDate" data-input required placeholder="dd/mm/yyyy">
                    </div>
                </form>
            </div>
            <!-- Step 2: Review selection (basket built from grid cell dropdowns) -->
            <div id="sendToDispatchStep2" style="display: none;">
                <div id="sendToDispatchStep2Context" class="alert alert-light border mb-3 py-2 small">
                    <strong>Buyer:</strong> <span id="sendToDispatchStep2BuyerLabel">—</span>
                    <span class="mx-2">|</span>
                    <strong>Delivery:</strong> <span id="sendToDispatchStep2DeliveryLabel">—</span>
                </div>
                <p class="text-muted small mb-3">Review the boxes you added from the grid. To add or change quantities, close this and click the quantity cells in the Kernel Stock by style table.</p>
                <div id="sendToDispatchStep2ReviewBody" class="table-responsive mb-3">
                    <!-- Filled by modal JS from _stockManagementGrid.dispatchSelectedLines -->
                </div>
            </div>
        </div>
        <div class="modal-footer" id="sendToDispatchStep1Footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="dispatchModalSelectBoxesBtn">
                <i class="fas fa-check-square me-1"></i>Next: Select boxes
            </button>
        </div>
        <div class="modal-footer" id="sendToDispatchStep2Footer" style="display: none;">
            <button type="button" class="btn btn-secondary" id="dispatchModalBackBtn">Back</button>
            <button type="button" class="btn btn-success" id="dispatchModalConfirmSelectionBtn">
                <i class="fas fa-check me-1"></i>Done
            </button>
        </div>
    </div>
</div>
