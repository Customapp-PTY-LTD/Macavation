<div class="modal-dialog modal-lg">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="endSampleModalLabel">PACKING</h5>
            <a target="_blank" rel="noopener noreferrer" href="help/index.html#modal-end-sample" class="btn btn-sm btn-outline-secondary ms-auto me-2 macavation-help-link" title="User guide"><i class="fas fa-circle-question me-1"></i>Help</a>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <p class="text-muted small mb-3">1 x kernel sample – ziplock bag, 1 x sterile bag, 1 x 1kg vacuum bag</p>
            <input type="hidden" id="endSampleProductionBatchId" value="">
            <div class="table-responsive">
                <table class="table align-middle table-bordered" id="endSampleTable">
                    <thead>
                        <tr><th>Description</th><th>Required (tick)</th><th>Result</th><th>UOM</th></tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Moisture</td>
                            <td><input type="checkbox" id="endSampleMoistureRequired" class="form-check-input"></td>
                            <td><input type="number" id="endSampleMoistureResult" class="form-control form-control-sm" step="0.01"></td>
                            <td>%</td>
                        </tr>
                        <tr>
                            <td>Peroxide Value</td>
                            <td><input type="checkbox" id="endSamplePeroxideRequired" class="form-check-input"></td>
                            <td><input type="number" id="endSamplePeroxideResult" class="form-control form-control-sm" step="0.01"></td>
                            <td>meqO2/kg</td>
                        </tr>
                        <tr>
                            <td>Free Fatty Acids</td>
                            <td><input type="checkbox" id="endSampleFfaRequired" class="form-check-input"></td>
                            <td><input type="number" id="endSampleFfaResult" class="form-control form-control-sm" step="0.01"></td>
                            <td>%</td>
                        </tr>
                        <tr>
                            <td>Internal Micro</td>
                            <td><input type="checkbox" id="endSampleInternalMicroRequired" class="form-check-input"></td>
                            <td><input type="text" id="endSampleInternalMicroResult" class="form-control form-control-sm"></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td>External lab testing</td>
                            <td><input type="checkbox" id="endSampleExternalLabRequired" class="form-check-input"></td>
                            <td><input type="text" id="endSampleExternalLabResult" class="form-control form-control-sm"></td>
                            <td></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="mb-3 mt-3" id="divUploadLabTestPdf">
                <label for="endSampleLabTestPdf" class="form-label">Lab test PDF</label>
                <input class="form-control" id="endSampleLabTestPdf" type="file" accept=".pdf,application/pdf" />
                <small class="form-text text-muted">Upload a PDF of the lab test report (max 10MB)</small>
                <div class="lab-test-pdf-preview mt-2" id="endSampleLabTestPdfPreview"></div>
            </div>
            <div class="row mt-3">
                <div class="col-md-6">
                    <label for="endSampleSupervisorSigned" class="form-label">Signed (Supervisor)</label>
                    <select id="endSampleSupervisorSigned" class="form-select">
                        <option value="">Select Supervisor</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="endSampleNutPlantManagerSigned" class="form-label">Signed (Nut Plant Manager)</label>
                    <select id="endSampleNutPlantManagerSigned" class="form-select">
                        <option value="">Select Nut Plant Manager</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="saveEndSampleBtn"><i class="fas fa-save me-1"></i>Save</button>
        </div>
    </div>
</div>
