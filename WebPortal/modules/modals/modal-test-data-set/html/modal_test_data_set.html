<div class="modal-dialog modal-lg">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="dataSetModalLabel">Add New Data Set</h5>
            <a href="help/index.html#modal-test-data-set" class="btn btn-sm btn-outline-secondary ms-auto me-2 macavation-help-link" title="User guide"><i class="fas fa-circle-question me-1"></i>Help</a>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form id="dataSetForm">
                <div class="mb-3">
                    <label for="setName" class="form-label required">Set Name</label>
                    <input type="text" class="form-control" id="setName" required>
                    <small class="form-text text-muted">Unique name for this test data set</small>
                </div>
                <div class="mb-3">
                    <label for="setModule" class="form-label required">Module</label>
                    <input type="text" class="form-control" id="setModule" list="moduleList" required>
                    <datalist id="moduleList">
                        <option value="authentication">
                        <option value="crm">
                        <option value="grower-intake">
                        <option value="kernel-production">
                        <option value="oil-production">
                        <option value="quality-assurance">
                        <option value="stock-management">
                        <option value="sales-forecasting">
                        <option value="financial-management">
                        <option value="user-management">
                    </datalist>
                </div>
                <div class="mb-3">
                    <label for="setDescription" class="form-label">Description</label>
                    <textarea class="form-control" id="setDescription" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label for="setScenarioIds" class="form-label">Linked Test Scenarios (UUIDs)</label>
                    <textarea class="form-control font-monospace" id="setScenarioIds" rows="3" placeholder='["uuid1", "uuid2"]'></textarea>
                    <small class="form-text text-muted">Enter scenario IDs as JSON array of UUIDs</small>
                </div>
                <div class="mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="setIsActive" checked>
                        <label class="form-check-label" for="setIsActive">
                            Active
                        </label>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="saveDataSetBtn">
                <i class="fas fa-save me-1"></i>Save Data Set
            </button>
        </div>
    </div>
</div>
