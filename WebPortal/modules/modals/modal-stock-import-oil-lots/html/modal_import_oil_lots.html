<div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
        <div class="modal-header bg-success text-white">
            <h5 class="modal-title" id="importOilLotsModalLabel">Import Oil Stock from Excel</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <div class="mb-3">
                <label for="oilImportExcelFile" class="form-label required">Excel File</label>
                <input type="file" class="form-control" id="oilImportExcelFile" accept=".xlsx,.xls" required>
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="oilImportSheet" class="form-label">Sheet</label>
                    <select id="oilImportSheet" class="form-select" disabled>
                        <option value="">Select sheet</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Import Defaults</label>
                    <div class="d-flex gap-2">
                        <select id="oilImportDefaultLocation" class="form-select">
                            <option value="">Location (auto)</option>
                            <option value="801">801</option>
                            <option value="850">850</option>
                        </select>
                        <select id="oilImportDefaultCategory" class="form-select">
                            <option value="">Category (auto)</option>
                            <option value="raw_material">Raw Material</option>
                            <option value="finished_good">Finished Good</option>
                            <option value="sold">Sold</option>
                        </select>
                    </div>
                </div>
            </div>
            <div id="oilImportPreview" class="mt-3" style="display:none;">
                <h6>Preview (first 10 rows)</h6>
                <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
                    <table class="table table-sm table-bordered" id="oilImportPreviewTable">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
            <div class="small text-muted mt-2">
                Expected columns (any subset): Delivery Date, Supplier/Customer, PO Reference, Batch #, Product Description, Grade, FFA, COA Status, Units, Volume, Kilograms, Manufacture Date, BB Date, Status.
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-success" id="performOilImportBtn" disabled><i class="fas fa-upload me-1"></i>Import</button>
        </div>
    </div>
</div>
