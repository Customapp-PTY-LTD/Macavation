<div class="modal-dialog modal-xl">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="receivingChecklistModalLabel">Incoming Receiving Checklist</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form id="receivingChecklistForm">
                <input type="hidden" id="receivingId">
                <div class="card mb-3">
                    <div class="card-header"><h6 class="mb-0">Vehicle & Receiving Checks</h6></div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Is the vehicle clean?</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="vehicleClean" id="vehicleCleanYes" value="Yes">
                                            <label class="form-check-label" for="vehicleCleanYes">Yes</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="vehicleClean" id="vehicleCleanNo" value="No">
                                            <label class="form-check-label" for="vehicleCleanNo">No</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Vehicle fully enclosed?</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="vehicleEnclosed" id="vehicleEnclosedYes" value="Yes">
                                            <label class="form-check-label" for="vehicleEnclosedYes">Yes</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="vehicleEnclosed" id="vehicleEnclosedNo" value="No">
                                            <label class="form-check-label" for="vehicleEnclosedNo">No</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Any hazard substances noted on truck?</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="hazardSubstances" id="hazardSubstancesYes" value="Yes">
                                            <label class="form-check-label" for="hazardSubstancesYes">Yes</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="hazardSubstances" id="hazardSubstancesNo" value="No">
                                            <label class="form-check-label" for="hazardSubstancesNo">No</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Any signs of pest infestations?</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="pestInfestations" id="pestInfestationsYes" value="Yes">
                                            <label class="form-check-label" for="pestInfestationsYes">Yes</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="pestInfestations" id="pestInfestationsNo" value="No">
                                            <label class="form-check-label" for="pestInfestationsNo">No</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Pallets received are in good condition</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="palletsCondition" id="palletsConditionYes" value="Yes">
                                            <label class="form-check-label" for="palletsConditionYes">Yes</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="palletsCondition" id="palletsConditionNo" value="No">
                                            <label class="form-check-label" for="palletsConditionNo">No</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Are raw materials received in good condition?</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="rawMaterialsCondition" id="rawMaterialsConditionYes" value="Yes">
                                            <label class="form-check-label" for="rawMaterialsConditionYes">Yes</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="rawMaterialsCondition" id="rawMaterialsConditionNo" value="No">
                                            <label class="form-check-label" for="rawMaterialsConditionNo">No</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="receivingComments" class="form-label">Comments/Actions taken</label>
                            <textarea class="form-control" id="receivingComments" rows="2"></textarea>
                        </div>
                    </div>
                </div>
                <div class="card mb-3">
                    <div class="card-header"><h6 class="mb-0">Receiving Information</h6></div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <label for="dateReceived" class="form-label required">Date Received</label>
                                <input type="date" class="form-control" id="dateReceived" required>
                            </div>
                            <div class="col-md-4">
                                <label for="deliveryNoteRef" class="form-label required">Delivery Note Reference/Number</label>
                                <input type="text" class="form-control" id="deliveryNoteRef" required>
                            </div>
                            <div class="col-md-4">
                                <label for="supplierDetails" class="form-label required">Supplier Details</label>
                                <select class="form-select" id="supplierDetails" required>
                                    <option value="">Select Supplier</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card mb-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6 class="mb-0">Received Items</h6>
                        <button type="button" class="btn btn-sm btn-primary" id="addReceivedItemRow"><i class="fas fa-plus"></i> Add Item</button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-sm" id="receivedItemsTable">
                                <thead>
                                    <tr>
                                        <th>Reference</th>
                                        <th>Description</th>
                                        <th>Batch</th>
                                        <th>Quantity (kg)</th>
                                        <th>Manufactured Date</th>
                                        <th>Best Before Date</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="receivedItemsTableBody">
                                    <tr>
                                        <td><input type="text" class="form-control form-control-sm" name="reference"></td>
                                        <td><input type="text" class="form-control form-control-sm" name="description"></td>
                                        <td><input type="text" class="form-control form-control-sm" name="batch"></td>
                                        <td><input type="number" class="form-control form-control-sm" name="quantity" step="0.01"></td>
                                        <td><input type="date" class="form-control form-control-sm" name="manufacturedDate"></td>
                                        <td><input type="date" class="form-control form-control-sm" name="bestBeforeDate"></td>
                                        <td><button type="button" class="btn btn-sm btn-danger removeItemRow"><i class="fas fa-times"></i></button></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="saveReceivingChecklistBtn"><i class="fas fa-save me-1"></i>Save Receiving Checklist</button>
        </div>
    </div>
</div>
