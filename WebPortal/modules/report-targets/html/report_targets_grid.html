<!-- Targets — the merged screen that replaces Dashboard Targets and Report Targets.
     One target per metric per period, laid out as a grid across the financial year. Each cell
     carries the target and, faint beneath it, the same period a year earlier. Where no figure
     was ever recorded for that earlier period the faint number is editable, which is how the
     retired "Prior periods" tab's job now gets done without a separate tab. -->
<div class="module-content" id="reportTargetsModule">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Targets</h1>
    </div>

    <ul class="nav nav-pills mb-3 report-targets-tabs" id="reportTargetsTabs">
        <li class="nav-item">
            <a class="nav-link active" href="#" data-tab="monthly">Monthly</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#" data-tab="weekly">Weekly</a>
        </li>
    </ul>

    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="targetsFy" class="form-label">Financial year</label>
                    <select class="form-select" id="targetsFy"></select>
                </div>
                <div class="col-md-3">
                    <label for="targetsSection" class="form-label">Section</label>
                    <select class="form-select" id="targetsSection">
                        <option value="">All sections</option>
                    </select>
                </div>
                <div class="col-md-6 d-flex gap-2 flex-wrap">
                    <button type="button" class="btn btn-outline-secondary" id="refreshTargetsBtn">
                        <i class="fas fa-sync-alt me-1"></i>Refresh
                    </button>
                    <button type="button" class="btn btn-outline-secondary" id="copyTargetsBtn"
                            data-action-perm="reports.target.edit">
                        <i class="fas fa-copy me-1"></i>Copy a period
                    </button>
                    <div class="btn-group d-none" id="weeklyPager" role="group" aria-label="Week range">
                        <button type="button" class="btn btn-outline-secondary" id="weeksPrevBtn"
                                aria-label="Earlier weeks"><i class="fas fa-chevron-left"></i></button>
                        <span class="btn btn-outline-secondary disabled" id="weeksRangeLabel">&nbsp;</span>
                        <button type="button" class="btn btn-outline-secondary" id="weeksNextBtn"
                                aria-label="Later weeks"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-2">
        <div class="card-body p-0">
            <div class="table-responsive targets-grid-scroll">
                <table class="table align-middle mb-0 targets-grid" id="reportTargetsTable">
                    <thead>
                        <tr id="targetsGridHeadRow">
                            <th class="targets-metric-col">Metric</th>
                        </tr>
                    </thead>
                    <tbody id="reportTargetsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="d-flex flex-wrap gap-3 align-items-center small text-muted mb-4 px-1"
         id="targetsLegend">
        <span><span class="targets-legend-swatch targets-legend-target"></span>Target &mdash; type in the cell, then Tab or click away to save</span>
        <span><span class="targets-legend-swatch targets-legend-prior"></span>Same period last year</span>
        <span><span class="targets-legend-swatch targets-legend-editable"></span>No figure recorded last year &mdash; click to type one in</span>
        <span><i class="fas fa-lock me-1"></i>A figure from a published report cannot be edited here</span>
    </div>
</div>
