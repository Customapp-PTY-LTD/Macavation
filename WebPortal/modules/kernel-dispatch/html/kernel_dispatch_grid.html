<!-- Kernel Dispatch: INV from W/House Finished (KERNEL R YES) → KERNEL CUSTOMERS → DEBTORS -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Kernel Dispatch</h1>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="kernelDispatchRefreshBtn"><i class="fas fa-sync-alt me-1"></i>Refresh</button>
    </div>
    <div class="card border-success mb-3">
        <div class="card-body">
            <h5 class="card-title text-success"><i class="fas fa-box me-2"></i>Kernel outbound</h5>
            <p class="card-text mb-2">Capture <strong>INV</strong> (inventory) from W/House Finished <strong>KERNEL R YES</strong> → <strong>KERNEL CUSTOMERS</strong> → <strong>DEBTORS</strong>.</p>
        </div>
    </div>
    <div class="card mb-4">
        <div class="card-header bg-light">
            <h5 class="mb-0">Batches ready to dispatch (finished stock)</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover" id="kernelDispatchTable">
                    <thead>
                        <tr>
                            <th>Batch number</th>
                            <th>Grower / supplier</th>
                            <th>Received date</th>
                            <th>Wet NIS (kg)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="kernelDispatchTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Dispatch batch modal (content loaded by app router from modal-kernel-dispatch) -->
<div class="modal fade" data-bs-backdrop="static" data-bs-keyboard="false" id="kernelDispatchModal" role="dialog" route-name="kernel-dispatch-modal" tabindex="-1" aria-labelledby="kernelDispatchModalLabel" aria-hidden="true"></div>
