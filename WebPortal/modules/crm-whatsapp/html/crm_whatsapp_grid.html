<div class="module-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>
            <i class="fab fa-whatsapp me-2"></i>WhatsApp & Messaging
        </h2>
        <a class="macavation-help-link" href="help/whatsapp-messaging.html" target="_blank" rel="noopener">
            <i class="fas fa-question-circle"></i> Help
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <!-- Tab Navigation -->
            <ul class="nav nav-tabs mb-3" id="whatsappTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="contacts-tab" data-bs-toggle="tab" data-bs-target="#contactsTabPane" type="button" role="tab">
                        <i class="fas fa-address-book me-1"></i> Contacts
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="internal-tab" data-bs-toggle="tab" data-bs-target="#internalTabPane" type="button" role="tab">
                        <i class="fas fa-users me-1"></i> Internal
                    </button>
                </li>
            </ul>

            <!-- Tab Content -->
            <div class="tab-content" id="whatsappTabContent">
                <!-- Contacts Tab -->
                <div class="tab-pane fade show active" id="contactsTabPane" role="tabpanel">
                    <div class="row g-0" style="height: calc(100vh - 280px); min-height: 500px;">
                        <!-- Left: Conversation List -->
                        <div class="col-md-4 border-end" style="height: 100%; overflow-y: auto;">
                            <div class="p-3 border-bottom">
                                <div class="d-flex gap-2">
                                    <input type="text" class="form-control form-control-sm" id="contactsSearchInput" placeholder="Search conversations...">
                                    <button class="btn btn-primary btn-sm" id="contactsNewChatBtn" data-action-perm="messaging.whatsapp.contact.send">
                                        <i class="fas fa-plus"></i>
                                    </button>
                                </div>
                            </div>
                            <div id="contactsConversationList" class="list-group list-group-flush">
                                <div class="text-center text-muted p-4">
                                    <i class="fas fa-spinner fa-spin"></i> Loading...
                                </div>
                            </div>
                        </div>

                        <!-- Right: Thread & Composer -->
                        <div class="col-md-8 d-flex flex-column" style="height: 100%;">
                            <div id="contactsThreadContainer" class="flex-grow-1 overflow-auto p-3" style="background-color: var(--mac-bg-secondary);">
                                <div class="text-center text-muted p-5">
                                    <i class="fab fa-whatsapp fa-3x mb-3"></i>
                                    <p>Select a conversation to view messages</p>
                                </div>
                            </div>
                            <div id="contactsComposerContainer" class="border-top p-3" style="display: none;">
                                <div class="alert alert-warning mb-2" id="contactsNotConnectedBanner" style="display: none;">
                                    <i class="fas fa-exclamation-triangle"></i> WhatsApp Business API not yet connected — messages are saved but won't be delivered until connected.
                                </div>
                                <div class="d-flex gap-2">
                                    <textarea class="form-control" id="contactsMessageInput" rows="2" placeholder="Type a message..." data-action-perm="messaging.whatsapp.contact.send"></textarea>
                                    <button class="btn btn-primary" id="contactsSendBtn" data-action-perm="messaging.whatsapp.contact.send">
                                        <i class="fas fa-paper-plane"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Internal Tab -->
                <div class="tab-pane fade" id="internalTabPane" role="tabpanel">
                    <div class="row g-0" style="height: calc(100vh - 280px); min-height: 500px;">
                        <!-- Left: Conversation List -->
                        <div class="col-md-4 border-end" style="height: 100%; overflow-y: auto;">
                            <div class="p-3 border-bottom">
                                <div class="d-flex gap-2">
                                    <input type="text" class="form-control form-control-sm" id="internalSearchInput" placeholder="Search conversations...">
                                    <button class="btn btn-primary btn-sm" id="internalNewChatBtn" data-action-perm="messaging.chat.use">
                                        <i class="fas fa-plus"></i>
                                    </button>
                                </div>
                            </div>
                            <div id="internalConversationList" class="list-group list-group-flush">
                                <div class="text-center text-muted p-4">
                                    <i class="fas fa-spinner fa-spin"></i> Loading...
                                </div>
                            </div>
                        </div>

                        <!-- Right: Thread & Composer -->
                        <div class="col-md-8 d-flex flex-column" style="height: 100%;">
                            <div id="internalThreadContainer" class="flex-grow-1 overflow-auto p-3" style="background-color: var(--mac-bg-secondary);">
                                <div class="text-center text-muted p-5">
                                    <i class="fas fa-users fa-3x mb-3"></i>
                                    <p>Select a conversation to view messages</p>
                                </div>
                            </div>
                            <div id="internalComposerContainer" class="border-top p-3" style="display: none;">
                                <div class="d-flex gap-2">
                                    <textarea class="form-control" id="internalMessageInput" rows="2" placeholder="Type a message..." data-action-perm="messaging.chat.use"></textarea>
                                    <button class="btn btn-primary" id="internalSendBtn" data-action-perm="messaging.chat.use">
                                        <i class="fas fa-paper-plane"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
