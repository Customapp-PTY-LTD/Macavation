<!-- Document Management Grid Module -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Document Management</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <button type="button" class="btn btn-primary" id="uploadDocBtn">
                <i class="fas fa-upload me-1"></i>Upload Document
            </button>
        </div>
    </div>
    <div class="card mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover" id="documentsTable">
                    <thead>
                        <tr>
                            <th>Document Name</th>
                            <th>Category</th>
                            <th>Uploaded By</th>
                            <th>Upload Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="documentsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Upload Document Modal -->
<div class="modal fade" id="uploadDocumentModal" tabindex="-1" aria-labelledby="uploadDocumentModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="uploadDocumentModalLabel">Upload Document</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="docUploadName" class="form-label">Document name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="docUploadName" placeholder="e.g. Safety Policy 2025" maxlength="500">
                </div>
                <div class="mb-3">
                    <label for="docUploadCategory" class="form-label">Category</label>
                    <div class="d-flex gap-2">
                        <select class="form-select flex-grow-1" id="docUploadCategory">
                            <option value="">— No category —</option>
                        </select>
                        <button type="button" class="btn btn-outline-secondary" id="docAddCategoryBtn" title="Add new category"><i class="fas fa-plus"></i></button>
                    </div>
                    <div id="docNewCategoryWrap" class="mt-2 d-none">
                        <div class="input-group input-group-sm">
                            <input type="text" class="form-control" id="docNewCategoryName" placeholder="New category name">
                            <button type="button" class="btn btn-outline-primary" id="docNewCategorySave">Add</button>
                            <button type="button" class="btn btn-outline-secondary" id="docNewCategoryCancel">Cancel</button>
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="docUploadFile" class="form-label">File <span class="text-danger">*</span></label>
                    <input type="file" class="form-control" id="docUploadFile" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.csv,.png,.jpg,.jpeg">
                    <div class="form-text">PDF, Word, Excel, text, images. Max size depends on server.</div>
                </div>
                <p id="docUploadStatus" class="text-muted small mb-0"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="docUploadSubmitBtn">Upload</button>
            </div>
        </div>
    </div>
</div>
