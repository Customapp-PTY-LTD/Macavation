<!-- Shell (Mike's MacView, round 3, 27 Nov 2026): shell bags on hand (weighed bag by bag on the cracking sheet)
     and shell sales per bag, oldest bags first. Rendered by js/shell.js from get_shell_overview
     (migration 20261128150000). Prices show only for roles with "See costs and prices". -->
<div class="module-content" id="shlModule">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center gap-2 pt-3 pb-2 mb-3 border-bottom">
        <div>
            <h1 class="h2 mb-0">Shell</h1>
            <div class="small text-muted">Shell is weighed bag by bag on the cracking sheet and sold per bag from here, oldest bags first.</div>
        </div>
        <button type="button" class="btn btn-primary d-none" id="shlAdd"><i class="fas fa-plus me-1"></i>Shell sale</button>
    </div>

    <div class="d-flex flex-wrap align-items-end gap-3 mb-3">
        <label class="mb-0" for="shlPeriod"><span class="d-block small text-muted">Sales period</span>
            <select class="form-select" id="shlPeriod"></select></label>
        <label class="mb-0 d-none shl-custom" for="shlFrom"><span class="d-block small text-muted">From</span>
            <input type="date" class="form-control" id="shlFrom"></label>
        <label class="mb-0 d-none shl-custom" for="shlTo"><span class="d-block small text-muted">To</span>
            <input type="date" class="form-control" id="shlTo"></label>
    </div>

    <div id="shlBody"><div class="text-muted py-4"><i class="fas fa-spinner fa-spin me-2"></i>Loading&hellip;</div></div>

    <div class="modal fade" id="shlModal" tabindex="-1" aria-labelledby="shlModalTitle" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="shlModalTitle">Shell sale</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-2">
                        <div class="col-6"><label class="form-label" for="shlDate">Invoice date</label><input type="date" class="form-control" id="shlDate"></div>
                        <div class="col-6"><label class="form-label" for="shlInvoice">Invoice no.</label><input type="text" class="form-control" id="shlInvoice" maxlength="60"></div>
                        <div class="col-12"><label class="form-label" for="shlCustomer">Customer</label>
                            <input type="text" class="form-control" id="shlCustomer" list="shlCustomers" maxlength="200" autocomplete="off" placeholder="Start typing a customer on the list">
                            <datalist id="shlCustomers"></datalist>
                            <div class="form-text" id="shlCustomerHint"></div></div>
                        <div class="col-6"><label class="form-label" for="shlBags">Bags sold <span class="text-muted small" id="shlAvail"></span></label><input type="number" class="form-control" id="shlBags" min="1" step="1"></div>
                        <div class="col-6"><label class="form-label" for="shlPrice">Price per bag (R, excl. VAT)</label><input type="text" inputmode="decimal" class="form-control" id="shlPrice"></div>
                        <div class="col-12"><label class="form-label" for="shlNotes">Notes</label><input type="text" class="form-control" id="shlNotes" maxlength="500"></div>
                    </div>
                    <div class="small mt-2" id="shlSum"></div>
                    <div class="text-danger small mt-1" id="shlErr" role="alert"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-danger me-auto d-none" id="shlVoid">Take this sale back</button>
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="shlSave">Save</button>
                </div>
            </div>
        </div>
    </div>
</div>
