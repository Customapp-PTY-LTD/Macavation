<!-- Kernel Production Grid Module -->
<div class="module-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Kernel Production Workflow</h1>
        <div class="btn-toolbar mb-2 mb-md-0 ms-auto">
            <button type="button" class="btn btn-outline-secondary" id="exportBatchesBtn">
                <i class="fas fa-download me-1"></i>Export
            </button>
        </div>
    </div>
    
    <!-- Search and Filters -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="searchBatchesInput" class="form-label">Search</label>
                    <input type="text" class="form-control" id="searchBatchesInput" placeholder="Search by batch number, grower, or status...">
                </div>
                <div class="col-md-3">
                    <label for="filterBatchStatus" class="form-label">Status</label>
                    <select class="form-select" id="filterBatchStatus">
                        <option value="">All Statuses</option>
                        <option value="awaiting_production">Awaiting production</option>
                        <option value="in_production">In production</option>
                        <option value="awaiting_test">Awaiting test</option>
                        <option value="release_ready">Release ready</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-outline-secondary w-100" id="clearBatchFiltersBtn">
                        <i class="fas fa-times me-1"></i>Clear
                    </button>
                </div>
                <div class="col-md-3 d-flex justify-content-end">
                    <div class="view-toggle">
                        <button class="view-toggle-btn active" data-view="kanban" id="kpViewKanban">
                            <i class="fas fa-columns me-1"></i>Board
                        </button>
                        <button class="view-toggle-btn" data-view="table" id="kpViewTable">
                            <i class="fas fa-list me-1"></i>Table
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Kanban Board (default view) -->
    <div id="kpKanbanBoard" class="kanban-board"></div>

    <!-- Table View (hidden by default) -->
    <div class="card mb-4" id="kpTableCard" style="display:none">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover" id="batchesTable">
                    <thead>
                        <tr>
                            <th>Batch Number</th>
                            <th>Supplier</th>
                            <th>Received Date</th>
                            <th>Wet NIS (kg)</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="batchesTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
