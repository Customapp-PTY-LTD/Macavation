<!-- 
    Template for Module HTML File
    Replace [MODULE_NAME] with your module name (e.g., "items", "products", "orders")
    File location: modules/[MODULE_NAME]/html/[MODULE_NAME]_grid.html
-->

<div class="container-fluid py-4">
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">[MODULE_NAME_DISPLAY] Management</h2>
            <p class="text-muted mb-0">Manage and track [MODULE_NAME_DISPLAY]</p>
        </div>
        <button type="button" class="btn btn-primary" id="btnAdd[MODULE_NAME]">
            <i class="fas fa-plus me-2"></i>Add New
        </button>
    </div>

    <!-- Filters/Controls -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="filterSearch" class="form-label">Search</label>
                    <input type="text" class="form-control" id="filterSearch" placeholder="Search...">
                </div>
                <div class="col-md-3">
                    <label for="filterStatus" class="form-label">Status</label>
                    <select class="form-select" id="filterStatus">
                        <option value="">All</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="filterDate" class="form-label">Date Range</label>
                    <input type="date" class="form-control" id="filterDate">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-secondary w-100" id="btnClearFilters">
                        <i class="fas fa-times me-2"></i>Clear
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Data Table -->
    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover" id="table[MODULE_NAME]">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table[MODULE_NAME]Body">
                        <tr>
                            <td colspan="5" class="text-center">
                                <div class="spinner-border spinner-border-sm" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                Loading data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Add/Edit Form -->
<div class="modal fade" id="modal[MODULE_NAME]Form" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal[MODULE_NAME]FormTitle">Add [MODULE_NAME_DISPLAY]</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="form[MODULE_NAME]">
                    <input type="hidden" id="form[MODULE_NAME]Id" name="id">
                    
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label for="form[MODULE_NAME]Name" class="form-label">Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="form[MODULE_NAME]Name" name="name" required>
                            <div class="invalid-feedback">Please provide a name.</div>
                        </div>
                        
                        <div class="col-md-12">
                            <label for="form[MODULE_NAME]Description" class="form-label">Description</label>
                            <textarea class="form-control" id="form[MODULE_NAME]Description" name="description" rows="3"></textarea>
                        </div>
                        
                        <div class="col-md-6">
                            <label for="form[MODULE_NAME]Status" class="form-label">Status</label>
                            <select class="form-select" id="form[MODULE_NAME]Status" name="is_active">
                                <option value="true">Active</option>
                                <option value="false">Inactive</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnSave[MODULE_NAME]">
                    <i class="fas fa-save me-2"></i>Save
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Delete Confirmation -->
<div class="modal fade" id="modal[MODULE_NAME]Delete" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this [MODULE_NAME_DISPLAY]? This action cannot be undone.</p>
                <p class="text-danger mb-0"><strong>Item:</strong> <span id="modal[MODULE_NAME]DeleteName"></span></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="btnConfirmDelete[MODULE_NAME]">
                    <i class="fas fa-trash me-2"></i>Delete
                </button>
            </div>
        </div>
    </div>
</div>
